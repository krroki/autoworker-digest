<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#fee500">
  <title>관찰대상방 인원 현황</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23fee500'/%3E%3Cellipse cx='32' cy='29' rx='21' ry='17' fill='%233c1e1e'/%3E%3Cpath d='M24 42l-6 9 13-8z' fill='%233c1e1e'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <style>
    :root {
      --kakao: #fee500;
      --kakao-deep: #f7d900;
      --brown: #3c1e1e;
      --bg: #edeef0;
      --card: #ffffff;
      --ink: #16181d;
      --ink-2: #3d434d;
      --muted: #8b919c;
      --line: #eaecef;
      --line-strong: #dfe2e7;
      --up: #12805c;
      --up-bg: #e8f6f0;
      --down: #d13b3b;
      --down-bg: #fdeeee;
      --flat: #8b919c;
      --flat-bg: #f1f2f4;
      --radius: 18px;
      --font: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }
    html { background: var(--bg); }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--bg);
      font-family: var(--font);
      font-size: 15px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
      word-break: keep-all;
    }
    button { font: inherit; }
    .num { font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }

    .app {
      width: min(760px, 100%);
      min-height: 100vh;
      margin: 0 auto;
      background: var(--bg);
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.04);
    }

    /* ── 상단 바 ─────────────────────── */
    .bar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 14px 18px;
      background: var(--kakao);
      color: var(--brown);
    }
    .bar h1 {
      margin: 0;
      font-size: 17px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .bar .when {
      margin: 2px 0 0;
      font-size: 12px;
      font-weight: 600;
      opacity: 0.72;
    }
    .badge-off {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      flex: 0 0 auto;
      padding: 6px 11px;
      border-radius: 999px;
      background: rgba(60, 30, 30, 0.1);
      color: var(--brown);
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }
    .badge-off svg { width: 13px; height: 13px; }

    .body { padding: 14px 14px 40px; }

    /* ── 전체 합계 ───────────────────── */
    .total {
      padding: 16px 18px 14px;
      border-radius: var(--radius);
      background: var(--card);
      box-shadow: 0 1px 2px rgba(16, 18, 22, 0.06);
    }
    .total-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
    }
    .refresh {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 11px;
      border: 0;
      border-radius: 999px;
      background: var(--kakao);
      color: var(--brown);
      font-size: 12.5px;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
    }
    .refresh svg { width: 13px; height: 13px; }
    .refresh[disabled] { opacity: 0.55; cursor: default; }
    .refresh.spin svg { animation: spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .total .right .cap { display: block; margin: 5px 0 4px; }

    .gauge { margin-top: 12px; }
    .gauge-bar {
      height: 8px;
      overflow: hidden;
      border-radius: 999px;
      background: #eceef1;
    }
    .gauge-bar span {
      display: block;
      height: 100%;
      width: 0;
      border-radius: 999px;
      background: var(--accent, var(--brown));
      transition: width 320ms ease;
    }
    .gauge-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 6px;
      color: var(--muted);
      font-size: 12px;
    }
    .gauge-label b { color: var(--ink-2); font-weight: 800; }
    .gauge.full .gauge-bar span { background: var(--down); }
    .gauge.near .gauge-bar span { background: #e08b2a; }
    .total .cap { color: var(--muted); font-size: 12.5px; font-weight: 600; }
    .total .value {
      display: block;
      margin-top: 1px;
      font-size: 34px;
      font-weight: 800;
      line-height: 1.08;
    }
    .total .value small { margin-left: 2px; font-size: 15px; font-weight: 700; color: var(--muted); }
    .total .right { text-align: right; }

    .delta {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      margin-top: 4px;
      padding: 4px 9px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
    }
    .delta.up { color: var(--up); background: var(--up-bg); }
    .delta.down { color: var(--down); background: var(--down-bg); }
    .delta.flat, .delta.none { color: var(--flat); background: var(--flat-bg); }
    .delta.none { font-weight: 700; }

    /* ── 구획 제목 ───────────────────── */
    .sec {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 22px 4px 8px;
    }
    .sec h2 { margin: 0; font-size: 14px; font-weight: 800; color: var(--ink-2); }
    .sec .hint { color: var(--muted); font-size: 12px; }

    .range { display: inline-flex; padding: 3px; border-radius: 10px; background: #e3e5e9; }
    .range button {
      min-width: 42px;
      padding: 5px 9px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: #6d737d;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
    }
    .range button[aria-pressed="true"] {
      background: var(--card);
      color: var(--ink);
      box-shadow: 0 1px 2px rgba(16, 18, 22, 0.12);
    }

    /* ── 방 목록(채팅목록 결) ─────────── */
    .rooms {
      overflow: hidden;
      border-radius: var(--radius);
      background: var(--card);
      box-shadow: 0 1px 2px rgba(16, 18, 22, 0.06);
    }
    .room {
      padding: 13px 16px;
      border-bottom: 1px solid var(--line);
    }
    .room-main {
      display: grid;
      grid-template-columns: 52px minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px;
    }
    .room .gauge { margin-top: 10px; }
    .room .gauge-bar { height: 6px; }
    .rooms .room:last-child { border-bottom: 0; }

    .avatar {
      position: relative;
      width: 52px;
      height: 52px;
      border-radius: 19px;
      overflow: hidden;
      background: #dfe2e7;
    }
    .avatar img { display: block; width: 100%; height: 100%; object-fit: cover; }
    .avatar .letter {
      display: grid;
      width: 100%;
      height: 100%;
      place-items: center;
      color: #fff;
      background: var(--accent, #9aa1ac);
      font-size: 20px;
      font-weight: 800;
    }

    .room .info { min-width: 0; }
    .room .name {
      margin: 0;
      overflow: hidden;
      font-size: 15px;
      font-weight: 700;
      line-height: 1.3;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .room .meta {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 3px;
      color: var(--muted);
      font-size: 12.5px;
    }
    .room .meta .spark { display: block; width: 68px; height: 20px; flex: 0 0 auto; }
    .room .meta .trend { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .room .meta .trend b { font-weight: 700; }
    .room .meta .trend b.up { color: var(--up); }
    .room .meta .trend b.down { color: var(--down); }

    .room .stat { text-align: right; }
    .room .count { font-size: 22px; font-weight: 800; line-height: 1.15; }
    .room .count small { margin-left: 1px; font-size: 12px; font-weight: 700; color: var(--muted); }
    .room .delta { margin-top: 2px; padding: 2px 7px; font-size: 12px; }

    /* ── 추이 그래프 ─────────────────── */
    .chart-card {
      padding: 14px 12px 12px;
      border-radius: var(--radius);
      background: var(--card);
      box-shadow: 0 1px 2px rgba(16, 18, 22, 0.06);
    }
    #chart { display: block; width: 100%; height: 190px; }
    .chart-empty {
      display: grid;
      place-items: center;
      min-height: 120px;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }
    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 14px;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--line);
    }
    .legend span {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: var(--ink-2);
      font-size: 12.5px;
      font-weight: 600;
    }
    .legend i {
      width: 10px;
      height: 3px;
      border-radius: 2px;
      background: var(--accent, #9aa1ac);
    }

    /* ── 기본 닉네임 ─────────────────── */
    .friends {
      overflow: hidden;
      border-radius: var(--radius);
      background: var(--card);
      box-shadow: 0 1px 2px rgba(16, 18, 22, 0.06);
    }
    .friends-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px 12px;
      border-bottom: 1px solid var(--line);
    }
    .friends-top .cap { color: var(--muted); font-size: 12.5px; font-weight: 600; }
    .friends-top .value { display: block; margin-top: 1px; font-size: 26px; font-weight: 800; }
    .friends-top .value small { margin-left: 2px; font-size: 13px; font-weight: 700; color: var(--muted); }
    .friends-share {
      padding: 5px 10px;
      border-radius: 999px;
      background: var(--kakao);
      color: var(--brown);
      font-size: 14px;
      font-weight: 800;
      white-space: nowrap;
    }
    #friends-table { min-width: 0; }
    #friends-table th.who, #friends-table td.who { text-align: left; white-space: nowrap; }
    #friends-table th.room-col { padding-left: 6px; padding-right: 6px; }
    #friends-table .room-head {
      display: flex;
      justify-content: center;
      width: 100%;
    }
    #friends-table .room-head img,
    #friends-table .room-head span {
      width: 26px;
      height: 26px;
      border-radius: 9px;
      object-fit: cover;
    }
    #friends-table .room-head span {
      display: grid;
      place-items: center;
      background: var(--accent, #9aa1ac);
      color: #fff;
      font-size: 12px;
      font-weight: 800;
    }
    #friends-table td.room-col { padding-left: 6px; padding-right: 6px; color: var(--ink-2); }
    #friends-table td.zero { color: #c3c7ce; }
    #friends-table td.sum { font-weight: 800; }
    #friends-table tbody tr:first-child td { background: transparent; font-weight: 400; }
    #friends-table tbody tr:first-child td.sum { font-weight: 800; }
    #friends-table tbody tr:first-child td.who { background: var(--card); }

    /* ── 일별 표 ─────────────────────── */
    .ledger {
      overflow: hidden;
      border-radius: var(--radius);
      background: var(--card);
      box-shadow: 0 1px 2px rgba(16, 18, 22, 0.06);
    }
    .table-wrap { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    table { width: 100%; min-width: 560px; border-collapse: separate; border-spacing: 0; font-size: 13.5px; }
    th, td {
      padding: 10px 14px;
      border-bottom: 1px solid var(--line);
      text-align: right;
      white-space: nowrap;
    }
    th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: #f7f8fa;
      color: var(--muted);
      font-size: 11.5px;
      font-weight: 700;
    }
    th:first-child, td:first-child {
      position: sticky;
      left: 0;
      z-index: 2;
      text-align: left;
      background: var(--card);
      box-shadow: 1px 0 0 var(--line);
    }
    th:first-child { background: #f7f8fa; z-index: 3; }
    th .dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      margin-right: 5px;
      border-radius: 50%;
      vertical-align: middle;
      background: var(--accent, #9aa1ac);
    }
    th .th-name {
      display: inline-block;
      max-width: 11em;
      overflow: hidden;
      text-overflow: ellipsis;
      vertical-align: middle;
    }
    tbody tr:first-child td { background: #fffbe6; font-weight: 700; }
    tbody tr:first-child td:first-child { background: #fffbe6; }
    tbody tr:last-child td { border-bottom: 0; }
    td .d { display: inline-block; min-width: 2.9em; margin-left: 6px; font-size: 11.5px; font-weight: 700; text-align: left; }
    td .d.up { color: var(--up); }
    td .d.down { color: var(--down); }
    td .d.flat, td .d.none { color: var(--muted); font-weight: 500; }
    .today-tag {
      display: inline-block;
      margin-left: 5px;
      padding: 1px 6px;
      border-radius: 6px;
      background: var(--kakao);
      color: var(--brown);
      font-size: 10.5px;
      font-weight: 800;
      vertical-align: middle;
    }

    .note { margin: 10px 4px 0; color: var(--muted); font-size: 12px; line-height: 1.6; }
    .note b { color: var(--ink-2); font-weight: 600; }

    .state {
      display: grid;
      place-items: center;
      min-height: 150px;
      padding: 24px;
      border-radius: var(--radius);
      background: var(--card);
      color: var(--muted);
      text-align: center;
    }
    .state b { display: block; margin-bottom: 4px; color: var(--ink); }
    .state button {
      margin-top: 12px;
      padding: 9px 16px;
      border: 0;
      border-radius: 10px;
      background: var(--kakao);
      color: var(--brown);
      font-weight: 800;
      cursor: pointer;
    }

    .foot { margin: 18px 4px 0; color: var(--muted); font-size: 11.5px; }

    @media (max-width: 400px) {
      .body { padding: 12px 10px 32px; }
      .room { padding: 12px; }
      .room-main { grid-template-columns: 46px minmax(0, 1fr) auto; gap: 10px; }
      .avatar { width: 46px; height: 46px; border-radius: 17px; }
      .room .meta .spark { width: 52px; }
      .total .value { font-size: 31px; }
      th, td { padding: 9px 10px; }
      th .th-name { max-width: 7em; }
    }

    @media (min-width: 760px) {
      .app { margin: 18px auto; min-height: 0; border-radius: 22px; overflow: hidden; }
      .bar { border-radius: 0; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="bar">
      <div>
        <h1>관찰대상방 인원 현황</h1>
        <p class="when" id="when">불러오는 중…</p>
      </div>
      <span class="badge-off" id="mode">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="9"></circle><path d="M6 6l12 12"></path>
        </svg>
        <span id="mode-text">발신 차단</span>
      </span>
    </header>

    <main class="body">
      <section class="total" aria-label="전체 인원">
        <div class="total-row">
          <div>
            <span class="cap">전체 인원 <span id="total-rooms"></span></span>
            <strong class="value num" id="total-count">—</strong>
          </div>
          <div class="right">
            <button class="refresh" type="button" id="refresh">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M20 11a8 8 0 1 0-.6 4"></path><path d="M20 4v7h-7"></path>
              </svg>
              <span id="refresh-text">새로고침</span>
            </button>
            <div class="cap" id="live-when"></div>
            <span class="delta none" id="total-delta">—</span>
          </div>
        </div>
        <div class="gauge" id="total-gauge">
          <div class="gauge-bar"><span id="total-fill"></span></div>
          <div class="gauge-label"><span id="total-cap"></span><b id="total-pct"></b></div>
        </div>
      </section>

      <div class="sec">
        <h2>방별 인원</h2>
        <div class="range" role="group" aria-label="표시 기간">
          <button type="button" data-days="7" aria-pressed="false">7일</button>
          <button type="button" data-days="14" aria-pressed="true">14일</button>
          <button type="button" data-days="30" aria-pressed="false">30일</button>
          <button type="button" data-days="0" aria-pressed="false">전체</button>
        </div>
      </div>
      <div class="rooms" id="rooms" aria-live="polite">
        <div class="state">불러오는 중…</div>
      </div>

      <div class="sec">
        <h2>인원 추이</h2>
        <span class="hint" id="chart-hint"></span>
      </div>
      <div class="chart-card">
        <svg id="chart" role="img" aria-label="방별 인원 추이 그래프"></svg>
        <div class="legend" id="legend"></div>
      </div>

      <section id="friends-block" hidden>
        <div class="sec">
          <h2>기본 닉네임</h2>
          <span class="hint" id="friends-hint"></span>
        </div>
        <div class="friends">
          <div class="friends-top">
            <div>
              <span class="cap">프렌즈 닉네임 그대로 쓰는 사람</span>
              <strong class="value num" id="friends-total">—</strong>
            </div>
            <div class="friends-share num" id="friends-share"></div>
          </div>
          <div class="table-wrap">
            <table id="friends-table">
              <thead id="friends-head"></thead>
              <tbody id="friends-body"></tbody>
            </table>
          </div>
        </div>
      </section>

      <div class="sec">
        <h2>일별 기록</h2>
        <span class="hint" id="ledger-hint"></span>
      </div>
      <div class="ledger">
        <div class="table-wrap">
          <table>
            <thead id="ledger-head"></thead>
            <tbody id="ledger-body"></tbody>
          </table>
        </div>
      </div>
      <p class="note"><b>수집 기준</b> 매일 오전 9시 이후 첫 정상 확인값 · 숫자 옆 작은 값은 전날과의 차이</p>

      <p class="foot" id="foot"></p>
    </main>
  </div>

  <script>
    (function () {
      'use strict';

      var DATA_URL = './f35e6e35aeaa483d.json';
      var ACCENTS = ['#f5a623', '#4a90d9', '#7b68c9', '#3aab7a', '#e2698f', '#8b919c'];
      var WEEK = ['일', '월', '화', '수', '목', '금', '토'];
      var SVG = 'http://www.w3.org/2000/svg';

      var data = null;
      var days = 14;

      function n(v) { return Number(v).toLocaleString('ko-KR'); }
      function parseDate(t) { return new Date(t + 'T00:00:00+09:00'); }
      function fmtShort(t) { var d = parseDate(t); return (d.getMonth() + 1) + '/' + d.getDate() + ' (' + WEEK[d.getDay()] + ')'; }
      function fmtLong(t) { var d = parseDate(t); return d.getFullYear() + '. ' + (d.getMonth() + 1) + '. ' + d.getDate() + ' (' + WEEK[d.getDay()] + ')'; }

      function fmtClock(iso) {
        var d = new Date(iso);
        if (isNaN(d.getTime())) return '';
        return new Intl.DateTimeFormat('ko-KR', { hour: '2-digit', minute: '2-digit', hour12: false, timeZone: 'Asia/Seoul' }).format(d);
      }
      function fmtStamp(iso) {
        var d = new Date(iso);
        if (isNaN(d.getTime())) return '';
        return new Intl.DateTimeFormat('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false, timeZone: 'Asia/Seoul' }).format(d);
      }

      function cls(delta) {
        if (delta === null || typeof delta === 'undefined') return 'none';
        var v = Number(delta);
        if (v > 0) return 'up';
        if (v < 0) return 'down';
        return 'flat';
      }
      function deltaLabel(delta) {
        var c = cls(delta);
        if (c === 'none') return '첫 기록';
        if (c === 'flat') return '변동 없음';
        return (c === 'up' ? '▲ ' : '▼ ') + n(Math.abs(Number(delta))) + '명';
      }
      function deltaShort(delta) {
        if (cls(delta) === 'none') return '—';
        var v = Number(delta);
        return (v > 0 ? '+' : '') + n(v);
      }
      function setDelta(node, delta) {
        node.className = 'delta ' + cls(delta);
        node.textContent = deltaLabel(delta);
      }

      function visible(series) {
        if (!days || days >= series.length) return series.slice();
        return series.slice(-days);
      }

      function el(tag, className, text) {
        var node = document.createElement(tag);
        if (className) node.className = className;
        if (typeof text !== 'undefined') node.textContent = text;
        return node;
      }

      function drawSpark(svg, series, color) {
        while (svg.firstChild) svg.removeChild(svg.firstChild);
        var w = 68, h = 20, pad = 2;
        svg.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
        svg.setAttribute('preserveAspectRatio', 'none');
        var vals = series.map(function (s) { return Number(s.count); });
        if (vals.length < 2) return;
        var min = Math.min.apply(Math, vals);
        var max = Math.max.apply(Math, vals);
        var spread = Math.max(1, max - min);
        var pts = vals.map(function (v, i) {
          return [pad + i * ((w - pad * 2) / (vals.length - 1)), h - pad - ((v - min) / spread) * (h - pad * 2)];
        });
        var d = pts.map(function (p, i) { return (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1); }).join(' ');
        var path = document.createElementNS(SVG, 'path');
        path.setAttribute('d', d);
        path.setAttribute('fill', 'none');
        path.setAttribute('stroke', color);
        path.setAttribute('stroke-width', '1.8');
        path.setAttribute('stroke-linecap', 'round');
        path.setAttribute('stroke-linejoin', 'round');
        svg.appendChild(path);
        var last = pts[pts.length - 1];
        var dot = document.createElementNS(SVG, 'circle');
        dot.setAttribute('cx', last[0].toFixed(1));
        dot.setAttribute('cy', last[1].toFixed(1));
        dot.setAttribute('r', '2.2');
        dot.setAttribute('fill', color);
        svg.appendChild(dot);
      }

      function ago(iso) {
        var t = new Date(iso).getTime();
        if (isNaN(t)) return '';
        var m = Math.floor((Date.now() - t) / 60000);
        if (m < 1) return '방금';
        if (m < 60) return m + '분 전';
        var h = Math.floor(m / 60);
        if (h < 24) return h + '시간 전';
        return Math.floor(h / 24) + '일 전';
      }

      function setGauge(box, fill, capNode, pctNode, count, capacity) {
        var pct = capacity > 0 ? (count / capacity) * 100 : 0;
        fill.style.width = Math.max(1.5, Math.min(100, pct)) + '%';
        box.className = 'gauge' + (pct >= 95 ? ' full' : pct >= 80 ? ' near' : '');
        if (capNode) capNode.textContent = '정원 ' + n(capacity) + '명';
        if (pctNode) pctNode.textContent = pct.toFixed(pct < 10 ? 1 : 0) + '%';
      }

      // 지금 인원(live)이 있으면 그 값을, 없으면 오늘 기록값을 쓴다.
      function liveTotal() {
        return data.live ? Number(data.live.totalCount) : Number(data.summary.totalCount);
      }
      function liveRoomCount(room) {
        if (data.live && data.live.rooms && typeof data.live.rooms[room.key] === 'number') {
          return Number(data.live.rooms[room.key]);
        }
        return Number(room.currentCount);
      }

      // 큰 숫자가 지금 인원이면 증감도 지금 인원 기준이어야 한다.
      // 어제 기록이 없으면 비교 대상이 없으므로 null(첫 기록)이다.
      function shownDelta(history, shownCount, recordedDelta) {
        if (!data.live) return recordedDelta;
        if (!Array.isArray(history) || history.length < 2) return null;
        return shownCount - Number(history[history.length - 2].count);
      }

      function renderHead() {
        document.getElementById('when').textContent =
          fmtLong(data.latestDate) + ' · ' + fmtClock(data.capturedAt) + ' 확인';
        document.getElementById('mode-text').textContent = data.modeLabel || '발신 차단';
        document.getElementById('total-rooms').textContent = '· 방 ' + data.summary.roomCount + '개';
        var total = document.getElementById('total-count');
        total.replaceChildren(document.createTextNode(n(liveTotal())), el('small', null, '명'));
        setDelta(
          document.getElementById('total-delta'),
          shownDelta(data.totalHistory, liveTotal(), data.summary.totalDelta)
        );
        document.getElementById('live-when').textContent =
          data.live ? ago(data.live.checkedAt) + ' 확인' : '오늘 기록 기준';

        var capacity = Number(data.summary.capacity || 0);
        setGauge(
          document.getElementById('total-gauge'),
          document.getElementById('total-fill'),
          document.getElementById('total-cap'),
          document.getElementById('total-pct'),
          liveTotal(),
          capacity
        );
        document.getElementById('foot').textContent =
          '마지막 수집 ' + fmtStamp(data.generatedAt) + ' · 누적 기록 ' + data.totalHistory.length + '일';
      }

      function avatarNode(room, color) {
        var box = el('div', 'avatar');
        if (typeof room.avatar === 'string' && room.avatar.indexOf('data:image/') === 0) {
          var img = document.createElement('img');
          img.src = room.avatar;
          img.alt = '';
          img.loading = 'lazy';
          box.appendChild(img);
        } else {
          var letter = el('div', 'letter', (room.name || '?').trim().charAt(0));
          letter.style.setProperty('--accent', color);
          box.appendChild(letter);
        }
        return box;
      }

      function renderRooms() {
        var list = document.getElementById('rooms');
        list.replaceChildren();
        data.rooms.forEach(function (room, i) {
          var color = ACCENTS[i % ACCENTS.length];
          var row = el('article', 'room');
          var main = el('div', 'room-main');
          main.appendChild(avatarNode(room, color));

          var info = el('div', 'info');
          var name = el('p', 'name', room.name);
          name.title = room.name;
          info.appendChild(name);

          var meta = el('div', 'meta');
          var series = visible(room.history);
          if (series.length > 1) {
            var svg = document.createElementNS(SVG, 'svg');
            svg.setAttribute('class', 'spark');
            svg.setAttribute('aria-hidden', 'true');
            meta.appendChild(svg);
            var first = series[0];
            var diff = Number(series[series.length - 1].count) - Number(first.count);
            var trend = el('span', 'trend');
            trend.appendChild(document.createTextNode(fmtShort(first.date) + ' 대비 '));
            trend.appendChild(el('b', cls(diff), (diff > 0 ? '+' : '') + n(diff) + '명'));
            meta.appendChild(trend);
            drawSpark(svg, series, color);
          } else if (room.friends && Number(room.friends.members) > 0) {
            meta.appendChild(el('span', 'trend',
              '기본닉 ' + n(room.friends.defaultCount) + '명 · ' +
              Math.round((room.friends.defaultCount / room.friends.members) * 100) + '%'));
          } else {
            meta.appendChild(el('span', 'trend', '기록 1일째 · 내일부터 변화 표시'));
          }
          info.appendChild(meta);
          main.appendChild(info);

          var stat = el('div', 'stat');
          var count = el('div', 'count num');
          count.appendChild(document.createTextNode(n(liveRoomCount(room))));
          count.appendChild(el('small', null, '명'));
          stat.appendChild(count);
          var delta = el('span', 'delta');
          setDelta(delta, shownDelta(room.history, liveRoomCount(room), room.delta));
          stat.appendChild(delta);
          main.appendChild(stat);
          row.appendChild(main);

          var capacity = Number(room.capacity || 0);
          if (capacity > 0) {
            var gauge = el('div', 'gauge');
            var bar = el('div', 'gauge-bar');
            var fill = el('span');
            fill.style.setProperty('--accent', color);
            bar.appendChild(fill);
            gauge.appendChild(bar);
            var label = el('div', 'gauge-label');
            var capNode = el('span');
            var pctNode = el('b');
            label.appendChild(capNode);
            label.appendChild(pctNode);
            gauge.appendChild(label);
            row.appendChild(gauge);
            setGauge(gauge, fill, capNode, pctNode, liveRoomCount(room), capacity);
          }

          list.appendChild(row);
        });
      }

      function renderChart() {
        var svg = document.getElementById('chart');
        var legend = document.getElementById('legend');
        var hint = document.getElementById('chart-hint');
        while (svg.firstChild) svg.removeChild(svg.firstChild);
        legend.replaceChildren();

        // 방마다 규모가 4배씩 차이 나서 한 축에 겹치면 선이 전부 눌린다.
        // 여기서는 전체 합계만 그리고, 방별 흐름은 각 줄의 작은 그래프가 맡는다.
        var points = visible(data.totalHistory);
        var len = points.length;
        if (len < 2) {
          hint.textContent = '';
          svg.style.height = '54px';
          svg.setAttribute('viewBox', '0 0 100 40');
          var t = document.createElementNS(SVG, 'text');
          t.setAttribute('x', '50'); t.setAttribute('y', '22');
          t.setAttribute('text-anchor', 'middle');
          t.setAttribute('font-size', '5');
          t.setAttribute('fill', '#8b919c');
          t.textContent = '기록이 하루뿐이라 내일부터 그려집니다';
          svg.appendChild(t);
          return;
        }

        var W = 340, H = 190, padL = 34, padR = 8, padT = 12, padB = 22;
        svg.style.height = '190px';
        svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
        svg.setAttribute('preserveAspectRatio', 'none');

        var all = points.map(function (p) { return Number(p.count); });
        var min = Math.min.apply(Math, all);
        var max = Math.max.apply(Math, all);
        var pad = Math.max(10, Math.round((max - min) * 0.15));
        min = Math.max(0, min - pad);
        max = max + pad;
        var spread = Math.max(1, max - min);
        var x = function (i) { return padL + i * ((W - padL - padR) / (len - 1)); };
        var y = function (v) { return H - padB - ((v - min) / spread) * (H - padT - padB); };

        [0, 0.5, 1].forEach(function (f) {
          var value = Math.round(min + spread * (1 - f));
          var gy = padT + f * (H - padT - padB);
          var line = document.createElementNS(SVG, 'line');
          line.setAttribute('x1', padL); line.setAttribute('x2', W - padR);
          line.setAttribute('y1', gy); line.setAttribute('y2', gy);
          line.setAttribute('stroke', '#eceef1');
          svg.appendChild(line);
          var label = document.createElementNS(SVG, 'text');
          label.setAttribute('x', padL - 5); label.setAttribute('y', gy + 3);
          label.setAttribute('text-anchor', 'end');
          label.setAttribute('font-size', '8');
          label.setAttribute('fill', '#8b919c');
          label.textContent = n(value);
          svg.appendChild(label);
        });

        [0, len - 1].forEach(function (i) {
          var label = document.createElementNS(SVG, 'text');
          label.setAttribute('x', i === 0 ? padL : W - padR);
          label.setAttribute('y', H - 6);
          label.setAttribute('text-anchor', i === 0 ? 'start' : 'end');
          label.setAttribute('font-size', '8');
          label.setAttribute('fill', '#8b919c');
          label.textContent = fmtShort(points[i].date);
          svg.appendChild(label);
        });

        var line = points.map(function (p, i) {
          return (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(Number(p.count)).toFixed(1);
        }).join(' ');
        var area = document.createElementNS(SVG, 'path');
        area.setAttribute('d', line + ' L' + x(len - 1).toFixed(1) + ' ' + (H - padB) + ' L' + x(0).toFixed(1) + ' ' + (H - padB) + ' Z');
        area.setAttribute('fill', '#3d434d');
        area.setAttribute('opacity', '0.08');
        svg.appendChild(area);
        var path = document.createElementNS(SVG, 'path');
        path.setAttribute('d', line);
        path.setAttribute('fill', 'none');
        path.setAttribute('stroke', '#3d434d');
        path.setAttribute('stroke-width', '2.4');
        path.setAttribute('stroke-linecap', 'round');
        path.setAttribute('stroke-linejoin', 'round');
        svg.appendChild(path);
        var dot = document.createElementNS(SVG, 'circle');
        dot.setAttribute('cx', x(len - 1).toFixed(1));
        dot.setAttribute('cy', y(Number(points[len - 1].count)).toFixed(1));
        dot.setAttribute('r', '3.4');
        dot.setAttribute('fill', '#3d434d');
        dot.setAttribute('stroke', '#fff');
        dot.setAttribute('stroke-width', '1.6');
        svg.appendChild(dot);

        var first = Number(points[0].count);
        var last = Number(points[len - 1].count);
        var diff = last - first;
        var item = el('span');
        item.appendChild(document.createTextNode('전체 인원 · ' + fmtShort(points[0].date) + ' 대비 '));
        item.appendChild(el('b', cls(diff), (diff > 0 ? '+' : '') + n(diff) + '명'));
        legend.appendChild(item);

        hint.textContent = '최근 ' + len + '일';
      }

      function renderFriends() {
        var block = document.getElementById('friends-block');
        var summary = data.friendsSummary;
        var withFriends = data.rooms.filter(function (r) { return r.friends && r.friends.counts; });
        if (!summary || !withFriends.length) { block.hidden = true; return; }
        block.hidden = false;

        var total = document.getElementById('friends-total');
        total.replaceChildren(document.createTextNode(n(summary.defaultCount)), el('small', null, '명'));
        var share = summary.members > 0 ? Math.round((summary.defaultCount / summary.members) * 100) : 0;
        document.getElementById('friends-share').textContent = share + '%';
        document.getElementById('friends-hint').textContent =
          '현재 인원 ' + n(summary.members) + '명 기준';

        var head = document.getElementById('friends-head');
        var body = document.getElementById('friends-body');
        head.replaceChildren();
        body.replaceChildren();

        var tr = el('tr');
        tr.appendChild(el('th', 'who', '캐릭터'));
        withFriends.forEach(function (room) {
          var th = el('th', 'room-col');
          th.title = room.name;
          var box = el('div', 'room-head');
          var idx = data.rooms.indexOf(room);
          if (typeof room.avatar === 'string' && room.avatar.indexOf('data:image/') === 0) {
            var img = document.createElement('img');
            img.src = room.avatar;
            img.alt = room.name;
            box.appendChild(img);
          } else {
            var letter = el('span', null, (room.name || '?').trim().charAt(0));
            letter.style.setProperty('--accent', ACCENTS[idx % ACCENTS.length]);
            box.appendChild(letter);
          }
          th.appendChild(box);
          tr.appendChild(th);
        });
        tr.appendChild(el('th', null, '합계'));
        head.appendChild(tr);

        Object.keys(summary.counts).forEach(function (name) {
          var row = el('tr');
          row.appendChild(el('td', 'who', name));
          withFriends.forEach(function (room) {
            var v = Number(room.friends.counts[name] || 0);
            row.appendChild(el('td', 'room-col num' + (v ? '' : ' zero'), v ? n(v) : '·'));
          });
          row.appendChild(el('td', 'sum num', n(summary.counts[name])));
          body.appendChild(row);
        });
      }

      function renderLedger() {
        var head = document.getElementById('ledger-head');
        var body = document.getElementById('ledger-body');
        head.replaceChildren();
        body.replaceChildren();

        var tr = el('tr');
        tr.appendChild(el('th', null, '날짜'));
        tr.appendChild(el('th', null, '전체'));
        data.rooms.forEach(function (room, i) {
          var th = el('th');
          var dot = el('span', 'dot');
          dot.style.setProperty('--accent', ACCENTS[i % ACCENTS.length]);
          th.appendChild(dot);
          var nameSpan = el('span', 'th-name', room.name);
          nameSpan.title = room.name;
          th.appendChild(nameSpan);
          tr.appendChild(th);
        });
        head.appendChild(tr);

        var rows = visible(data.totalHistory).slice().reverse();
        rows.forEach(function (item, idx) {
          var row = el('tr');
          var dateCell = el('td', 'num', fmtShort(item.date));
          if (idx === 0) dateCell.appendChild(el('span', 'today-tag', '최신'));
          row.appendChild(dateCell);

          var totalCell = el('td', 'num');
          totalCell.appendChild(document.createTextNode(n(item.count)));
          totalCell.appendChild(el('span', 'd ' + cls(item.delta), deltaShort(item.delta)));
          row.appendChild(totalCell);

          data.rooms.forEach(function (room) {
            var match = null;
            for (var k = 0; k < room.history.length; k++) {
              if (room.history[k].date === item.date) { match = room.history[k]; break; }
            }
            var cell = el('td', 'num');
            if (match) {
              cell.appendChild(document.createTextNode(n(match.count)));
              cell.appendChild(el('span', 'd ' + cls(match.delta), deltaShort(match.delta)));
            } else {
              cell.textContent = '—';
            }
            row.appendChild(cell);
          });
          body.appendChild(row);
        });

        var hint = '최근 ' + rows.length + '일 · 최신순';
        var wrap = document.querySelector('.table-wrap');
        if (wrap && wrap.scrollWidth > wrap.clientWidth + 4) hint += ' · 표는 옆으로 밀어서 보기';
        document.getElementById('ledger-hint').textContent = hint;
      }

      function renderAll() {
        if (!data) return;
        renderHead();
        renderRooms();
        renderChart();
        renderFriends();
        renderLedger();
      }

      function showError() {
        var list = document.getElementById('rooms');
        list.replaceChildren();
        var box = el('div', 'state');
        var inner = el('div');
        inner.appendChild(el('b', null, '데이터를 불러오지 못했습니다'));
        inner.appendChild(document.createTextNode('잠시 후 다시 시도해 주세요.'));
        var btn = el('button', null, '다시 불러오기');
        btn.type = 'button';
        btn.addEventListener('click', load);
        inner.appendChild(btn);
        box.appendChild(inner);
        list.appendChild(box);
        document.getElementById('when').textContent = '데이터 없음';
      }

      function load() {
        return fetch(DATA_URL + '?v=' + Date.now(), { cache: 'no-store' })
          .then(function (r) { if (!r.ok) throw new Error('http ' + r.status); return r.json(); })
          .then(function (json) {
            if (!json || !json.summary || !Array.isArray(json.rooms) || !Array.isArray(json.totalHistory)) throw new Error('invalid');
            data = json;
            renderAll();
          })
          .catch(showError);
      }

      var refreshBtn = document.getElementById('refresh');
      var refreshText = document.getElementById('refresh-text');
      refreshBtn.addEventListener('click', function () {
        if (refreshBtn.disabled) return;
        refreshBtn.disabled = true;
        refreshBtn.classList.add('spin');
        refreshText.textContent = '확인 중';
        var started = Date.now();
        load().then(function () {
          // 너무 빨리 끝나면 눌린 느낌이 안 나서 최소 400ms는 돌린다.
          var wait = Math.max(0, 400 - (Date.now() - started));
          setTimeout(function () {
            refreshBtn.classList.remove('spin');
            refreshText.textContent = '새로고침';
            refreshBtn.disabled = false;
          }, wait);
        });
      });

      // 화면을 열어둔 채로 시간이 흐르면 "N분 전"이 낡는다. 1분마다 문구만 고친다.
      setInterval(function () {
        if (data && data.live) {
          document.getElementById('live-when').textContent = ago(data.live.checkedAt) + ' 확인';
        }
      }, 60000);

      document.querySelectorAll('.range button').forEach(function (btn) {
        btn.addEventListener('click', function () {
          days = Number(btn.getAttribute('data-days'));
          document.querySelectorAll('.range button').forEach(function (b) {
            b.setAttribute('aria-pressed', b === btn ? 'true' : 'false');
          });
          renderAll();
        });
      });

      load();
    }());
  </script>
</body>
</html>
