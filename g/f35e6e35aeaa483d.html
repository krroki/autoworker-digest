<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="color-scheme" content="light">
  <title>관찰대상방 인원 현황</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%230c2a22'/%3E%3Ccircle cx='32' cy='32' r='15' fill='%23173f33'/%3E%3Ccircle cx='32' cy='32' r='7' fill='%23d6ed69'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #f2f0e6;
      --paper-deep: #e4dfd0;
      --ink: #10231d;
      --muted: #62736c;
      --pine: #173f33;
      --pine-deep: #0c2a22;
      --lime: #d6ed69;
      --coral: #f27e5f;
      --mint: #83cdb0;
      --sky: #72a9c4;
      --line: rgba(16, 35, 29, 0.16);
      --white-line: rgba(255, 255, 255, 0.17);
      --shadow: 0 24px 70px rgba(20, 52, 43, 0.14);
      --radius-xl: 34px;
      --radius-lg: 24px;
      --radius-md: 16px;
    }

    * { box-sizing: border-box; }

    html { min-width: 320px; background: var(--paper); }

    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      color: var(--ink);
      background:
        radial-gradient(circle at 8% 8%, rgba(214, 237, 105, 0.38), transparent 25rem),
        radial-gradient(circle at 94% 38%, rgba(114, 169, 196, 0.18), transparent 28rem),
        var(--paper);
      font-family: "IBM Plex Sans KR", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.28;
      background-image:
        linear-gradient(rgba(16, 35, 29, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(16, 35, 29, 0.035) 1px, transparent 1px);
      background-size: 28px 28px;
      mask-image: linear-gradient(to bottom, black, transparent 78%);
    }

    button { font: inherit; }

    .shell {
      position: relative;
      width: min(1240px, calc(100% - 40px));
      margin: 0 auto;
      padding: 34px 0 64px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 28px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      flex: 0 0 42px;
      border-radius: 50%;
      color: var(--lime);
      background: var(--pine-deep);
      box-shadow: inset 0 0 0 7px rgba(214, 237, 105, 0.08);
    }

    .brand-mark::after {
      content: "";
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 0 5px rgba(214, 237, 105, 0.17);
    }

    .brand-copy { min-width: 0; }

    .eyebrow {
      margin: 0;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .brand-title {
      margin: 0;
      font-family: "Gowun Dodum", sans-serif;
      font-size: 20px;
      font-weight: 400;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .brand-status {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .mode-chip {
      display: inline-flex;
      min-height: 44px;
      align-items: center;
      gap: 9px;
      padding: 0 16px;
      flex: 0 0 auto;
      border: 1px solid rgba(23, 63, 51, 0.15);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.58);
      color: var(--pine);
      font-size: 13px;
      font-weight: 700;
      backdrop-filter: blur(12px);
    }

    .mode-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #3fa06d;
      box-shadow: 0 0 0 5px rgba(63, 160, 109, 0.12);
    }

    .hero {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 0.8fr) minmax(360px, 1.2fr);
      min-height: 310px;
      overflow: hidden;
      border-radius: var(--radius-xl);
      color: #f8f7ef;
      background: var(--pine-deep);
      box-shadow: var(--shadow);
    }

    .hero::after {
      content: "";
      position: absolute;
      width: 430px;
      height: 430px;
      right: -180px;
      top: -210px;
      border: 74px solid rgba(214, 237, 105, 0.1);
      border-radius: 50%;
      pointer-events: none;
    }

    .hero-copy {
      position: relative;
      z-index: 1;
      display: flex;
      min-width: 0;
      flex-direction: column;
      justify-content: center;
      padding: clamp(30px, 4vw, 48px);
    }

    .hero-kicker {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
      color: rgba(248, 247, 239, 0.68);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
    }

    .hero-kicker::before {
      content: "";
      width: 32px;
      height: 1px;
      background: var(--lime);
    }

    .hero h1 {
      max-width: 620px;
      margin: 0;
      font-family: "Gowun Dodum", sans-serif;
      font-size: clamp(34px, 4vw, 48px);
      font-weight: 400;
      line-height: 1.2;
      letter-spacing: -0.045em;
    }

    .hero h1 strong {
      color: var(--lime);
      font-weight: 600;
    }

    .hero-note {
      max-width: 490px;
      margin: 28px 0 0;
      color: rgba(248, 247, 239, 0.72);
      font-size: 15px;
      line-height: 1.75;
      word-break: keep-all;
    }

    .hero-meta {
      display: grid;
      gap: 12px;
      margin-top: 32px;
      color: rgba(248, 247, 239, 0.62);
      font-size: 13px;
    }

    .hero-meta strong { color: #fff; font-weight: 600; }

    .hero-metric {
      position: relative;
      z-index: 1;
      display: flex;
      min-width: 0;
      flex-direction: column;
      justify-content: space-between;
      margin: 12px;
      padding: clamp(24px, 4vw, 42px);
      border: 1px solid var(--white-line);
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(8px);
    }

    .metric-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: rgba(248, 247, 239, 0.65);
      font-size: 13px;
    }

    .metric-label span:last-child {
      color: var(--lime);
      font-variant-numeric: tabular-nums;
    }

    .metric-number {
      display: block;
      margin-top: 22px;
      font-size: clamp(54px, 8vw, 92px);
      font-weight: 600;
      line-height: 0.95;
      letter-spacing: -0.065em;
      font-variant-numeric: tabular-nums;
    }

    .metric-number small {
      margin-left: 6px;
      font-size: 18px;
      font-weight: 500;
      letter-spacing: -0.02em;
    }

    .delta-pill {
      display: inline-flex;
      width: fit-content;
      min-height: 38px;
      align-items: center;
      margin-top: 18px;
      padding: 0 12px;
      border-radius: 12px;
      color: var(--lime);
      background: rgba(214, 237, 105, 0.1);
      font-size: 13px;
      font-weight: 700;
    }

    .delta-pill.down { color: #ffb39f; background: rgba(242, 126, 95, 0.1); }
    .delta-pill.neutral { color: rgba(248, 247, 239, 0.76); }

    .hero-chart {
      width: 100%;
      height: 128px;
      margin-top: 28px;
      overflow: visible;
    }

    .section {
      margin-top: 36px;
    }

    .section-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 18px;
    }

    .section-title {
      margin: 0;
      font-family: "Gowun Dodum", sans-serif;
      font-size: clamp(27px, 4vw, 38px);
      font-weight: 400;
      letter-spacing: -0.045em;
    }

    .section-subtitle {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .range-control {
      display: inline-flex;
      padding: 4px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.5);
    }

    .range-button {
      min-width: 52px;
      min-height: 44px;
      padding: 0 12px;
      border: 0;
      border-radius: 10px;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
    }

    .range-button[aria-pressed="true"] {
      color: #fff;
      background: var(--pine);
    }

    .room-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
    }

    .room-card {
      position: relative;
      min-width: 0;
      overflow: hidden;
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      background: rgba(255, 255, 255, 0.58);
      box-shadow: 0 14px 40px rgba(20, 52, 43, 0.06);
    }

    .room-card::before {
      content: none;
    }

    .room-index {
      display: inline-flex;
      min-height: 29px;
      align-items: center;
      padding: 0 9px;
      border-radius: 999px;
      color: var(--pine);
      background: color-mix(in srgb, var(--room-accent, var(--mint)) 28%, transparent);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    .room-name {
      min-height: 54px;
      margin: 0 0 26px;
      font-family: "Gowun Dodum", sans-serif;
      font-size: 21px;
      font-weight: 400;
      line-height: 1.35;
      word-break: keep-all;
    }

    .room-stat {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
    }

    .room-count {
      font-size: 36px;
      font-weight: 600;
      line-height: 1;
      letter-spacing: -0.045em;
      font-variant-numeric: tabular-nums;
    }

    .room-count small { margin-left: 3px; color: var(--muted); font-size: 14px; font-weight: 500; }

    .room-delta {
      padding-bottom: 3px;
      color: #237750;
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }

    .room-delta.down { color: #ba4f37; }
    .room-delta.neutral { color: var(--muted); }

    .sparkline {
      width: 100%;
      height: 82px;
      margin-top: 22px;
      overflow: visible;
    }

    .ledger {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      background: rgba(255, 255, 255, 0.58);
    }

    .table-wrap { width: 100%; overflow-x: auto; }

    table {
      width: 100%;
      min-width: 760px;
      border-collapse: collapse;
      font-size: 13px;
    }

    th, td {
      padding: 17px 20px;
      border-bottom: 1px solid var(--line);
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    th:first-child, td:first-child { text-align: left; }
    th { color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: 0.04em; }
    tbody tr:last-child td { border-bottom: 0; }
    tbody tr:first-child { background: rgba(214, 237, 105, 0.13); }
    .table-delta.up { color: #237750; }
    .table-delta.down { color: #ba4f37; }

    .footnote {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-top: 18px;
      padding: 18px 20px;
      border-left: 3px solid var(--lime);
      color: var(--muted);
      background: rgba(255, 255, 255, 0.35);
      font-size: 12px;
      line-height: 1.7;
    }

    .footnote strong { color: var(--ink); }

    .loading,
    .error-card {
      display: grid;
      min-height: 220px;
      place-items: center;
      padding: 28px;
      border: 1px dashed var(--line);
      border-radius: var(--radius-lg);
      color: var(--muted);
      background: rgba(255, 255, 255, 0.42);
      text-align: center;
      line-height: 1.7;
    }

    .error-card button {
      min-height: 44px;
      margin-top: 14px;
      padding: 0 16px;
      border: 0;
      border-radius: 12px;
      color: #fff;
      background: var(--pine);
      cursor: pointer;
      font-weight: 700;
    }

    .site-footer {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 16px;
      margin-top: 34px;
      padding-top: 20px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 11px;
    }

    @media (max-width: 900px) {
      .hero { grid-template-columns: 1fr; }
      .hero-metric { min-height: 310px; }
      .room-grid { grid-template-columns: 1fr; }
      .room-name { min-height: 0; }
    }

    @media (max-width: 600px) {
      .shell { width: min(100% - 24px, 1240px); padding-top: 18px; }
      .topbar { align-items: flex-start; }
      .brand-title { max-width: 188px; font-size: 15px; }
      .mode-chip { padding: 0 12px; justify-content: center; font-size: 12px; }
      .hero { min-height: 0; border-radius: 26px; }
      .hero-copy { padding: 34px 24px 30px; }
      .hero h1 { font-size: 36px; }
      .hero-meta { margin-top: 24px; gap: 8px; }
      .hero-metric { min-height: 290px; margin: 0 10px 10px; padding: 26px 22px; }
      .metric-number { font-size: 58px; }
      .section { margin-top: 38px; }
      .section-head { align-items: flex-start; flex-direction: column; }
      .range-control { width: 100%; }
      .range-button { flex: 1; }
      .room-card { padding: 22px; }
      .site-footer { align-items: flex-start; flex-direction: column; }
    }

    @media (prefers-reduced-motion: no-preference) {
      .room-card { transition: transform 180ms ease, box-shadow 180ms ease; }
      .room-card:hover { transform: translateY(-3px); box-shadow: 0 20px 46px rgba(20, 52, 43, 0.1); }
      .range-button { transition: color 150ms ease, background 150ms ease; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"></div>
        <div class="brand-copy">
          <p class="brand-title">관찰대상방 인원 현황</p>
          <p class="brand-status" id="captured-label">마지막 수집 확인 중</p>
        </div>
      </div>
      <div class="mode-chip"><span class="mode-dot" aria-hidden="true"></span><span>발신 차단</span></div>
    </header>

    <section class="hero" aria-labelledby="hero-title">
      <div class="hero-copy">
        <h1 id="hero-title">관찰 방 <strong id="room-count-label">3개</strong></h1>
        <div class="hero-meta">
          <span>기준일 <strong id="summary-date-label">—</strong></span>
        </div>
      </div>
      <div class="hero-metric">
        <div>
          <div class="metric-label"><span>현재 전체 인원</span><span id="latest-date-label">—</span></div>
          <strong class="metric-number" id="total-count">—<small>명</small></strong>
          <span class="delta-pill neutral" id="total-delta">—</span>
        </div>
        <svg class="hero-chart" id="total-chart" role="img" aria-label="전체 인원 변화 그래프"></svg>
      </div>
    </section>

    <section class="section" aria-labelledby="room-section-title">
      <div class="section-head">
        <h2 class="section-title" id="room-section-title">방별 인원</h2>
        <div class="range-control" aria-label="그래프 표시 기간">
          <button class="range-button" type="button" data-days="7" aria-pressed="false">7일</button>
          <button class="range-button" type="button" data-days="14" aria-pressed="true">14일</button>
          <button class="range-button" type="button" data-days="30" aria-pressed="false">30일</button>
        </div>
      </div>
      <div id="room-grid" class="room-grid" aria-live="polite">
        <div class="loading">데이터 불러오는 중</div>
      </div>
    </section>

    <section class="section" aria-labelledby="ledger-title">
      <div class="section-head">
        <h2 class="section-title" id="ledger-title">일별 기록</h2>
      </div>
      <div class="ledger">
        <div class="table-wrap">
          <table>
            <thead id="ledger-head"></thead>
            <tbody id="ledger-body"></tbody>
          </table>
        </div>
      </div>
      <div class="footnote">
        <span><strong>수집 기준</strong> · 매일 오전 9시 이후 첫 정상 확인값</span>
      </div>
    </section>

    <footer class="site-footer">
      <span id="generated-label">마지막 수집 —</span>
    </footer>
  </main>

  <script>
    (function () {
      'use strict';

      var dataUrl = './f35e6e35aeaa483d.json';
      var palette = ['#83cdb0', '#f27e5f', '#72a9c4'];
      var dashboardData = null;
      var selectedDays = 14;
      var svgNamespace = 'http://www.w3.org/2000/svg';

      function formatNumber(value) {
        return Number(value).toLocaleString('ko-KR');
      }

      function formatDate(dateText, withYear) {
        var date = new Date(dateText + 'T00:00:00+09:00');
        return new Intl.DateTimeFormat('ko-KR', {
          year: withYear ? 'numeric' : undefined,
          month: 'short',
          day: 'numeric',
          weekday: withYear ? 'short' : undefined
        }).format(date);
      }

      function formatCaptured(isoText) {
        var date = new Date(isoText);
        if (Number.isNaN(date.getTime())) return '수집 시각 없음';
        return new Intl.DateTimeFormat('ko-KR', {
          month: 'long',
          day: 'numeric',
          hour: 'numeric',
          minute: '2-digit',
          timeZone: 'Asia/Seoul'
        }).format(date) + ' 기준';
      }

      function deltaText(value, firstLabel) {
        if (value === null || typeof value === 'undefined') return firstLabel || '비교 데이터 없음';
        return '전일 대비 ' + (Number(value) > 0 ? '+' : '') + formatNumber(value) + '명';
      }

      function deltaClass(value) {
        if (value === null || Number(value) === 0) return 'neutral';
        return Number(value) < 0 ? 'down' : 'up';
      }

      function drawSparkline(svg, series, color, compact) {
        while (svg.firstChild) svg.removeChild(svg.firstChild);
        var width = compact ? 320 : 420;
        var height = compact ? 82 : 128;
        var padX = compact ? 5 : 8;
        var padY = compact ? 9 : 12;
        var values = series.map(function (item) { return Number(item.count); });
        if (!values.length) return;
        var min = Math.min.apply(Math, values);
        var max = Math.max.apply(Math, values);
        var spread = Math.max(1, max - min);
        var points = values.map(function (value, index) {
          var x = values.length === 1 ? width / 2 : padX + index * ((width - padX * 2) / (values.length - 1));
          var y = height - padY - ((value - min) / spread) * (height - padY * 2);
          return { x: x, y: y };
        });

        svg.setAttribute('viewBox', '0 0 ' + width + ' ' + height);
        svg.setAttribute('preserveAspectRatio', 'none');

        [0.25, 0.5, 0.75].forEach(function (fraction) {
          var line = document.createElementNS(svgNamespace, 'line');
          line.setAttribute('x1', '0');
          line.setAttribute('x2', String(width));
          line.setAttribute('y1', String(height * fraction));
          line.setAttribute('y2', String(height * fraction));
          line.setAttribute('stroke', compact ? 'rgba(16,35,29,.09)' : 'rgba(255,255,255,.10)');
          line.setAttribute('stroke-dasharray', '3 7');
          svg.appendChild(line);
        });

        var pathData = points.map(function (point, index) {
          return (index === 0 ? 'M ' : 'L ') + point.x.toFixed(2) + ' ' + point.y.toFixed(2);
        }).join(' ');
        var path = document.createElementNS(svgNamespace, 'path');
        path.setAttribute('d', pathData);
        path.setAttribute('fill', 'none');
        path.setAttribute('stroke', color);
        path.setAttribute('stroke-width', compact ? '3' : '3.5');
        path.setAttribute('stroke-linecap', 'round');
        path.setAttribute('stroke-linejoin', 'round');
        svg.appendChild(path);

        var last = points[points.length - 1];
        var dot = document.createElementNS(svgNamespace, 'circle');
        dot.setAttribute('cx', String(last.x));
        dot.setAttribute('cy', String(last.y));
        dot.setAttribute('r', compact ? '4.5' : '5');
        dot.setAttribute('fill', color);
        dot.setAttribute('stroke', compact ? '#f8f7ef' : '#0c2a22');
        dot.setAttribute('stroke-width', '3');
        svg.appendChild(dot);
      }

      function visibleSeries(series) {
        return series.slice(-Math.min(selectedDays, series.length));
      }

      function renderHero(data) {
        document.getElementById('room-count-label').textContent = data.summary.roomCount + '개';
        document.getElementById('captured-label').textContent = '마지막 수집 ' + formatCaptured(data.capturedAt);
        document.getElementById('latest-date-label').textContent = formatDate(data.latestDate, false);
        document.getElementById('summary-date-label').textContent = formatDate(data.latestDate, true);
        document.getElementById('total-count').innerHTML = formatNumber(data.summary.totalCount) + '<small>명</small>';
        var delta = document.getElementById('total-delta');
        delta.textContent = deltaText(data.summary.totalDelta, '비교 데이터 없음');
        delta.className = 'delta-pill ' + deltaClass(data.summary.totalDelta);
        drawSparkline(document.getElementById('total-chart'), visibleSeries(data.totalHistory), '#d6ed69', false);
        document.getElementById('generated-label').textContent = '마지막 수집 ' + formatCaptured(data.generatedAt);
      }

      function renderRooms(data) {
        var grid = document.getElementById('room-grid');
        grid.replaceChildren();
        data.rooms.forEach(function (room, index) {
          var card = document.createElement('article');
          card.className = 'room-card';
          card.style.setProperty('--room-accent', palette[index % palette.length]);

          var name = document.createElement('h3');
          name.className = 'room-name';
          name.textContent = room.name;

          var stat = document.createElement('div');
          stat.className = 'room-stat';
          var count = document.createElement('div');
          count.className = 'room-count';
          count.appendChild(document.createTextNode(formatNumber(room.currentCount)));
          var unit = document.createElement('small');
          unit.textContent = '명';
          count.appendChild(unit);
          var delta = document.createElement('span');
          delta.className = 'room-delta ' + deltaClass(room.delta);
          delta.textContent = deltaText(room.delta, '비교 데이터 없음');
          stat.appendChild(count);
          stat.appendChild(delta);

          var svg = document.createElementNS(svgNamespace, 'svg');
          svg.setAttribute('class', 'sparkline');
          svg.setAttribute('role', 'img');
          svg.setAttribute('aria-label', room.name + ' 인원 변화 그래프');
          drawSparkline(svg, visibleSeries(room.history), palette[index % palette.length], true);

          card.appendChild(name);
          card.appendChild(stat);
          card.appendChild(svg);
          grid.appendChild(card);
        });
      }

      function renderLedger(data) {
        var head = document.getElementById('ledger-head');
        var body = document.getElementById('ledger-body');
        head.replaceChildren();
        body.replaceChildren();

        var headRow = document.createElement('tr');
        ['날짜', '전체', '증감'].concat(data.rooms.map(function (room) { return room.name; })).forEach(function (label) {
          var th = document.createElement('th');
          th.scope = 'col';
          th.textContent = label;
          headRow.appendChild(th);
        });
        head.appendChild(headRow);

        var totals = visibleSeries(data.totalHistory).slice().reverse();
        totals.forEach(function (totalItem) {
          var row = document.createElement('tr');
          var dateCell = document.createElement('td');
          dateCell.textContent = formatDate(totalItem.date, true);
          row.appendChild(dateCell);

          var totalCell = document.createElement('td');
          totalCell.textContent = formatNumber(totalItem.count) + '명';
          row.appendChild(totalCell);

          var deltaCell = document.createElement('td');
          deltaCell.className = 'table-delta ' + deltaClass(totalItem.delta);
          deltaCell.textContent = totalItem.delta === null ? '—' : (Number(totalItem.delta) > 0 ? '+' : '') + formatNumber(totalItem.delta);
          row.appendChild(deltaCell);

          data.rooms.forEach(function (room) {
            var matching = room.history.find(function (item) { return item.date === totalItem.date; });
            var cell = document.createElement('td');
            cell.textContent = matching ? formatNumber(matching.count) + '명' : '—';
            row.appendChild(cell);
          });
          body.appendChild(row);
        });
      }

      function renderAll() {
        if (!dashboardData) return;
        renderHero(dashboardData);
        renderRooms(dashboardData);
        renderLedger(dashboardData);
      }

      function showError() {
        var grid = document.getElementById('room-grid');
        grid.replaceChildren();
        var card = document.createElement('div');
        card.className = 'error-card';
        var content = document.createElement('div');
        var title = document.createElement('strong');
        title.textContent = '데이터를 불러오지 못했습니다.';
        var text = document.createElement('div');
        text.textContent = '다시 시도해 주세요.';
        var retry = document.createElement('button');
        retry.type = 'button';
        retry.textContent = '다시 불러오기';
        retry.addEventListener('click', loadData);
        content.appendChild(title);
        content.appendChild(text);
        content.appendChild(retry);
        card.appendChild(content);
        grid.appendChild(card);
      }

      function loadData() {
        fetch(dataUrl + '?v=' + Date.now(), { cache: 'no-store' })
          .then(function (response) {
            if (!response.ok) throw new Error('not ready');
            return response.json();
          })
          .then(function (data) {
            if (!data || !data.summary || !Array.isArray(data.rooms)) throw new Error('invalid data');
            dashboardData = data;
            renderAll();
          })
          .catch(showError);
      }

      document.querySelectorAll('.range-button').forEach(function (button) {
        button.addEventListener('click', function () {
          selectedDays = Number(button.getAttribute('data-days'));
          document.querySelectorAll('.range-button').forEach(function (item) {
            item.setAttribute('aria-pressed', item === button ? 'true' : 'false');
          });
          renderAll();
        });
      });

      loadData();
    }());
  </script>
</body>
</html>
