<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#ffffff">
  <title>관찰대상방 인원 현황</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23111827'/%3E%3Cpath d='M14 40l10-12 9 8 17-18' fill='none' stroke='%2334d399' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <style>
    :root {
      --bg: #f4f5f7;
      --card: #ffffff;
      --ink: #111827;
      --ink-2: #374151;
      --muted: #6b7280;
      --line: #e5e7eb;
      --line-strong: #d1d5db;
      --up: #15803d;
      --up-bg: #ecfdf3;
      --down: #b91c1c;
      --down-bg: #fef2f2;
      --flat: #6b7280;
      --flat-bg: #f3f4f6;
      --accent-1: #2563eb;
      --accent-2: #d97706;
      --accent-3: #7c3aed;
      --radius: 14px;
      --font: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }
    html { background: var(--bg); }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--bg);
      font-family: var(--font);
      font-size: 15px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      word-break: keep-all;
    }
    button { font: inherit; }
    .num { font-variant-numeric: tabular-nums; }

    .wrap {
      width: min(1080px, 100% - 32px);
      margin: 0 auto;
      padding: 20px 0 48px;
    }

    /* ── 머리 ───────────────────────── */
    .head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }
    .head h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.25;
    }
    .head .sub {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 13px;
    }
    .head .sub b { color: var(--ink-2); font-weight: 600; }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex: 0 0 auto;
      padding: 6px 10px;
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      background: var(--card);
      color: var(--ink-2);
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }
    .chip::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #9ca3af;
    }

    /* ── 전체 합계 ───────────────────── */
    .total {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 20px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--ink);
      color: #fff;
    }
    .total .label {
      color: rgba(255, 255, 255, 0.7);
      font-size: 13px;
      font-weight: 600;
    }
    .total .value {
      display: block;
      margin-top: 2px;
      font-size: 40px;
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.05;
    }
    .total .value small {
      margin-left: 3px;
      font-size: 16px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.75);
    }
    .total .delta-box { text-align: right; }
    .total .delta-box .cap {
      color: rgba(255, 255, 255, 0.6);
      font-size: 12px;
    }
    .delta {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 800;
      white-space: nowrap;
    }
    .delta.up { color: var(--up); background: var(--up-bg); }
    .delta.down { color: var(--down); background: var(--down-bg); }
    .delta.flat { color: var(--flat); background: var(--flat-bg); }
    .delta.none { color: var(--flat); background: var(--flat-bg); font-weight: 600; }
    .total .delta.up { color: #4ade80; background: rgba(74, 222, 128, 0.16); }
    .total .delta.down { color: #fca5a5; background: rgba(252, 165, 165, 0.16); }
    .total .delta.flat, .total .delta.none { color: rgba(255, 255, 255, 0.8); background: rgba(255, 255, 255, 0.12); }

    /* ── 구획 ────────────────────────── */
    .section { margin-top: 24px; }
    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }
    .section-head h2 {
      margin: 0;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.01em;
    }
    .section-head .hint { color: var(--muted); font-size: 12px; }

    .range {
      display: inline-flex;
      padding: 3px;
      border: 1px solid var(--line-strong);
      border-radius: 10px;
      background: var(--card);
    }
    .range button {
      min-width: 44px;
      padding: 6px 10px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    .range button[aria-pressed="true"] { background: var(--ink); color: #fff; }

    /* ── 방 카드 ─────────────────────── */
    .rooms {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }
    .room {
      position: relative;
      min-width: 0;
      padding: 16px 16px 14px;
      border: 1px solid var(--line);
      border-top: 4px solid var(--accent, var(--accent-1));
      border-radius: var(--radius);
      background: var(--card);
    }
    .room .name {
      margin: 0;
      min-height: 2.6em;
      font-size: 15px;
      font-weight: 700;
      line-height: 1.3;
      color: var(--ink-2);
    }
    .room .count {
      margin-top: 10px;
      font-size: 36px;
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.05;
    }
    .room .count small { margin-left: 2px; font-size: 15px; font-weight: 600; color: var(--muted); }
    .room .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 10px;
    }
    .room .row .cap { color: var(--muted); font-size: 12px; }
    .room .spark { display: block; width: 100%; height: 56px; margin-top: 12px; }
    .room .spark-note {
      margin-top: 8px;
      display: flex;
      justify-content: space-between;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
    }
    .room .spark-note b { font-weight: 700; }
    .room .spark-note .up { color: var(--up); }
    .room .spark-note .down { color: var(--down); }

    /* ── 일별 표 ─────────────────────── */
    .ledger {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--card);
    }
    .table-wrap { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    table {
      width: 100%;
      min-width: 640px;
      border-collapse: separate;
      border-spacing: 0;
      font-size: 14px;
    }
    th, td {
      padding: 10px 14px;
      border-bottom: 1px solid var(--line);
      text-align: right;
      vertical-align: middle;
      white-space: nowrap;
    }
    th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: #f9fafb;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }
    th:first-child, td:first-child {
      position: sticky;
      left: 0;
      z-index: 2;
      text-align: left;
      background: var(--card);
      box-shadow: 1px 0 0 var(--line);
    }
    th:first-child { background: #f9fafb; z-index: 3; }
    th .th-name {
      display: inline-block;
      max-width: 14em;
      overflow: hidden;
      text-overflow: ellipsis;
      vertical-align: middle;
    }
    th .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      margin-right: 6px;
      border-radius: 50%;
      vertical-align: middle;
      background: var(--accent, var(--accent-1));
    }
    tbody tr:first-child td { background: #fffbeb; font-weight: 700; }
    tbody tr:first-child td:first-child { background: #fffbeb; }
    tbody tr:last-child td { border-bottom: 0; }
    td .d {
      display: inline-block;
      min-width: 3.2em;
      margin-left: 6px;
      font-size: 12px;
      font-weight: 700;
      text-align: left;
    }
    td .d.up { color: var(--up); }
    td .d.down { color: var(--down); }
    td .d.flat, td .d.none { color: var(--muted); font-weight: 500; }
    td.total-col { font-weight: 700; }
    .today-tag {
      display: inline-block;
      margin-left: 6px;
      padding: 1px 6px;
      border-radius: 6px;
      background: #fde68a;
      color: #78350f;
      font-size: 11px;
      font-weight: 800;
      vertical-align: middle;
    }

    .note {
      margin-top: 10px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
    }
    .note b { color: var(--ink-2); font-weight: 600; }

    .state {
      display: grid;
      place-items: center;
      min-height: 160px;
      padding: 24px;
      border: 1px dashed var(--line-strong);
      border-radius: var(--radius);
      background: var(--card);
      color: var(--muted);
      text-align: center;
    }
    .state b { display: block; color: var(--ink); margin-bottom: 4px; }
    .state button {
      margin-top: 12px;
      padding: 8px 14px;
      border: 0;
      border-radius: 8px;
      background: var(--ink);
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }

    .foot {
      margin-top: 28px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
    }

    @media (max-width: 760px) {
      .wrap { width: min(100% - 24px, 1080px); padding-top: 14px; }
      .head h1 { font-size: 20px; }
      .rooms { grid-template-columns: 1fr; }
      .room .name { min-height: 0; }
      .room .count { font-size: 34px; }
      .total { padding: 16px; }
      .total .value { font-size: 36px; }
      .section-head { flex-wrap: wrap; }
      .range { width: 100%; }
      .range button { flex: 1; }
      th, td { padding: 9px 10px; }
      th .th-name { max-width: 7em; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header class="head">
      <div>
        <h1>관찰대상방 인원 현황</h1>
        <p class="sub" id="head-sub">불러오는 중…</p>
      </div>
      <span class="chip" id="mode-chip">발신 차단</span>
    </header>

    <section class="total" aria-label="전체 인원">
      <div>
        <span class="label">전체 인원 <span id="total-rooms"></span></span>
        <strong class="value num" id="total-count">—</strong>
      </div>
      <div class="delta-box">
        <div class="cap">전일 대비</div>
        <span class="delta none" id="total-delta">—</span>
      </div>
    </section>

    <section class="section" aria-labelledby="rooms-title">
      <div class="section-head">
        <h2 id="rooms-title">방별 인원</h2>
        <div class="range" role="group" aria-label="표시 기간">
          <button type="button" data-days="7" aria-pressed="false">7일</button>
          <button type="button" data-days="14" aria-pressed="true">14일</button>
          <button type="button" data-days="30" aria-pressed="false">30일</button>
          <button type="button" data-days="0" aria-pressed="false">전체</button>
        </div>
      </div>
      <div class="rooms" id="rooms" aria-live="polite">
        <div class="state">불러오는 중…</div>
      </div>
    </section>

    <section class="section" aria-labelledby="ledger-title">
      <div class="section-head">
        <h2 id="ledger-title">일별 기록</h2>
        <span class="hint" id="ledger-hint"></span>
      </div>
      <div class="ledger">
        <div class="table-wrap">
          <table>
            <thead id="ledger-head"></thead>
            <tbody id="ledger-body"></tbody>
          </table>
        </div>
      </div>
      <p class="note"><b>수집 기준</b> 매일 오전 9시 이후 첫 정상 확인값 · 숫자 옆 작은 값은 전날과의 차이</p>
    </section>

    <footer class="foot" id="foot"></footer>
  </main>

  <script>
    (function () {
      'use strict';

      var DATA_URL = './f35e6e35aeaa483d.json';
      var ACCENTS = ['#2563eb', '#d97706', '#7c3aed', '#0d9488', '#db2777', '#4b5563'];
      var WEEK = ['일', '월', '화', '수', '목', '금', '토'];
      var SVG = 'http://www.w3.org/2000/svg';

      var data = null;
      var days = 14;

      function n(v) { return Number(v).toLocaleString('ko-KR'); }

      function parseDate(text) { return new Date(text + 'T00:00:00+09:00'); }

      function fmtDateShort(text) {
        var d = parseDate(text);
        return (d.getMonth() + 1) + '/' + d.getDate() + ' (' + WEEK[d.getDay()] + ')';
      }

      function fmtDateLong(text) {
        var d = parseDate(text);
        return d.getFullYear() + '. ' + (d.getMonth() + 1) + '. ' + d.getDate() + ' (' + WEEK[d.getDay()] + ')';
      }

      function fmtTime(iso) {
        var d = new Date(iso);
        if (isNaN(d.getTime())) return '';
        return new Intl.DateTimeFormat('ko-KR', { hour: '2-digit', minute: '2-digit', hour12: false, timeZone: 'Asia/Seoul' }).format(d);
      }

      function fmtStamp(iso) {
        var d = new Date(iso);
        if (isNaN(d.getTime())) return '';
        return new Intl.DateTimeFormat('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false, timeZone: 'Asia/Seoul' }).format(d);
      }

      function cls(delta) {
        if (delta === null || typeof delta === 'undefined') return 'none';
        var v = Number(delta);
        if (v > 0) return 'up';
        if (v < 0) return 'down';
        return 'flat';
      }

      function arrow(delta) {
        var c = cls(delta);
        if (c === 'up') return '▲';
        if (c === 'down') return '▼';
        return '';
      }

      // 큰 표시용: "▲ 12명" / "▼ 3명" / "변동 없음" / "첫 기록"
      function deltaLabel(delta) {
        var c = cls(delta);
        if (c === 'none') return '첫 기록';
        if (c === 'flat') return '변동 없음';
        return arrow(delta) + ' ' + n(Math.abs(Number(delta))) + '명';
      }

      // 표용: "+12" / "-3" / "0" / "—"
      function deltaShort(delta) {
        var c = cls(delta);
        if (c === 'none') return '—';
        var v = Number(delta);
        return (v > 0 ? '+' : '') + n(v);
      }

      function setDelta(el, delta) {
        el.className = el.className.replace(/\b(up|down|flat|none)\b/g, '').trim() + ' ' + cls(delta);
        el.textContent = deltaLabel(delta);
      }

      function visible(series) {
        if (!days || days >= series.length) return series.slice();
        return series.slice(-days);
      }

      function el(tag, className, text) {
        var node = document.createElement(tag);
        if (className) node.className = className;
        if (typeof text !== 'undefined') node.textContent = text;
        return node;
      }

      function drawSpark(svg, series, color) {
        while (svg.firstChild) svg.removeChild(svg.firstChild);
        var w = Math.max(120, Math.round(svg.clientWidth || 280));
        var h = Math.round(svg.clientHeight || 56);
        svg.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
        svg.setAttribute('width', w);
        svg.setAttribute('height', h);

        var vals = series.map(function (s) { return Number(s.count); });
        if (!vals.length) return;
        var min = Math.min.apply(Math, vals);
        var max = Math.max.apply(Math, vals);
        var spread = Math.max(1, max - min);
        var padX = 6, padY = 6;
        var pts = vals.map(function (v, i) {
          var x = vals.length === 1 ? w - padX : padX + i * ((w - padX * 2) / (vals.length - 1));
          var y = h - padY - ((v - min) / spread) * (h - padY * 2);
          return [x, y];
        });

        var base = document.createElementNS(SVG, 'line');
        base.setAttribute('x1', padX); base.setAttribute('x2', w - padX);
        base.setAttribute('y1', h - padY); base.setAttribute('y2', h - padY);
        base.setAttribute('stroke', '#e5e7eb');
        svg.appendChild(base);

        if (pts.length > 1) {
          var d = pts.map(function (p, i) { return (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1); }).join(' ');
          var area = document.createElementNS(SVG, 'path');
          area.setAttribute('d', d + ' L' + pts[pts.length - 1][0].toFixed(1) + ' ' + (h - padY) + ' L' + pts[0][0].toFixed(1) + ' ' + (h - padY) + ' Z');
          area.setAttribute('fill', color);
          area.setAttribute('opacity', '0.12');
          svg.appendChild(area);
          var path = document.createElementNS(SVG, 'path');
          path.setAttribute('d', d);
          path.setAttribute('fill', 'none');
          path.setAttribute('stroke', color);
          path.setAttribute('stroke-width', '2.5');
          path.setAttribute('stroke-linecap', 'round');
          path.setAttribute('stroke-linejoin', 'round');
          svg.appendChild(path);
        }
        var last = pts[pts.length - 1];
        var dot = document.createElementNS(SVG, 'circle');
        dot.setAttribute('cx', last[0]); dot.setAttribute('cy', last[1]); dot.setAttribute('r', '4');
        dot.setAttribute('fill', color);
        dot.setAttribute('stroke', '#fff'); dot.setAttribute('stroke-width', '2');
        svg.appendChild(dot);
      }

      function renderHead() {
        document.getElementById('head-sub').innerHTML =
          '기준일 <b>' + fmtDateLong(data.latestDate) + '</b> · ' + fmtTime(data.capturedAt) + ' 수집';
        document.getElementById('mode-chip').textContent = data.modeLabel || '발신 차단';
        document.getElementById('total-rooms').textContent = '(' + data.summary.roomCount + '개 방)';
        var total = document.getElementById('total-count');
        total.textContent = '';
        total.appendChild(document.createTextNode(n(data.summary.totalCount)));
        total.appendChild(el('small', null, '명'));
        setDelta(document.getElementById('total-delta'), data.summary.totalDelta);
        document.getElementById('foot').textContent = '마지막 수집 ' + fmtStamp(data.generatedAt) + ' · 누적 기록 ' + data.totalHistory.length + '일';
      }

      function renderRooms() {
        var grid = document.getElementById('rooms');
        grid.replaceChildren();
        data.rooms.forEach(function (room, i) {
          var color = ACCENTS[i % ACCENTS.length];
          var card = el('article', 'room');
          card.style.setProperty('--accent', color);

          card.appendChild(el('h3', 'name', room.name));

          var count = el('div', 'count num');
          count.appendChild(document.createTextNode(n(room.currentCount)));
          count.appendChild(el('small', null, '명'));
          card.appendChild(count);

          var row = el('div', 'row');
          row.appendChild(el('span', 'cap', '전일 대비'));
          var delta = el('span', 'delta');
          setDelta(delta, room.delta);
          row.appendChild(delta);
          card.appendChild(row);

          var series = visible(room.history);
          var svg = null;
          if (series.length > 1) {
            svg = document.createElementNS(SVG, 'svg');
            svg.setAttribute('class', 'spark');
            svg.setAttribute('role', 'img');
            svg.setAttribute('aria-label', room.name + ' 인원 변화');
            card.appendChild(svg);
          }

          var note = el('div', 'spark-note');
          if (series.length > 1) {
            var first = series[0], lastItem = series[series.length - 1];
            var diff = Number(lastItem.count) - Number(first.count);
            var left = el('span');
            left.appendChild(document.createTextNode(fmtDateShort(first.date) + ' ' + n(first.count) + '명 → '));
            var b = el('b', cls(diff), (diff > 0 ? '+' : '') + n(diff) + '명');
            left.appendChild(b);
            note.appendChild(left);
            note.appendChild(el('span', null, series.length + '일'));
          } else {
            note.appendChild(el('span', null, '기록 1일째 · 내일부터 변화가 표시됩니다'));
          }
          card.appendChild(note);

          grid.appendChild(card);
          if (svg) drawSpark(svg, series, color);
        });
      }

      function renderLedger() {
        var head = document.getElementById('ledger-head');
        var body = document.getElementById('ledger-body');
        head.replaceChildren();
        body.replaceChildren();

        var tr = el('tr');
        tr.appendChild(el('th', null, '날짜'));
        tr.appendChild(el('th', null, '전체'));
        data.rooms.forEach(function (room, i) {
          var th = el('th');
          var dot = el('span', 'dot');
          dot.style.setProperty('--accent', ACCENTS[i % ACCENTS.length]);
          th.appendChild(dot);
          var nameSpan = el('span', 'th-name', room.name);
          nameSpan.title = room.name;
          th.appendChild(nameSpan);
          tr.appendChild(th);
        });
        head.appendChild(tr);

        var rows = visible(data.totalHistory).slice().reverse();
        rows.forEach(function (item, idx) {
          var row = el('tr');
          var dateCell = el('td', 'num', fmtDateShort(item.date));
          if (idx === 0) dateCell.appendChild(el('span', 'today-tag', '최신'));
          row.appendChild(dateCell);

          var totalCell = el('td', 'num total-col');
          totalCell.appendChild(document.createTextNode(n(item.count)));
          totalCell.appendChild(el('span', 'd ' + cls(item.delta), deltaShort(item.delta)));
          row.appendChild(totalCell);

          data.rooms.forEach(function (room) {
            var match = null;
            for (var k = 0; k < room.history.length; k++) {
              if (room.history[k].date === item.date) { match = room.history[k]; break; }
            }
            var cell = el('td', 'num');
            if (match) {
              cell.appendChild(document.createTextNode(n(match.count)));
              cell.appendChild(el('span', 'd ' + cls(match.delta), deltaShort(match.delta)));
            } else {
              cell.textContent = '—';
            }
            row.appendChild(cell);
          });
          body.appendChild(row);
        });

        document.getElementById('ledger-hint').textContent =
          '최근 ' + rows.length + '일 · 최신순';
      }

      function renderAll() {
        if (!data) return;
        renderHead();
        renderRooms();
        renderLedger();
      }

      function showError() {
        var grid = document.getElementById('rooms');
        grid.replaceChildren();
        var box = el('div', 'state');
        var inner = el('div');
        inner.appendChild(el('b', null, '데이터를 불러오지 못했습니다'));
        inner.appendChild(document.createTextNode('잠시 후 다시 시도해 주세요.'));
        var btn = el('button', null, '다시 불러오기');
        btn.type = 'button';
        btn.addEventListener('click', load);
        inner.appendChild(btn);
        box.appendChild(inner);
        grid.appendChild(box);
        document.getElementById('head-sub').textContent = '데이터 없음';
      }

      function load() {
        fetch(DATA_URL + '?v=' + Date.now(), { cache: 'no-store' })
          .then(function (r) { if (!r.ok) throw new Error('http ' + r.status); return r.json(); })
          .then(function (json) {
            if (!json || !json.summary || !Array.isArray(json.rooms) || !Array.isArray(json.totalHistory)) throw new Error('invalid');
            data = json;
            renderAll();
          })
          .catch(showError);
      }

      document.querySelectorAll('.range button').forEach(function (btn) {
        btn.addEventListener('click', function () {
          days = Number(btn.getAttribute('data-days'));
          document.querySelectorAll('.range button').forEach(function (b) {
            b.setAttribute('aria-pressed', b === btn ? 'true' : 'false');
          });
          renderAll();
        });
      });

      var resizeTimer = null;
      window.addEventListener('resize', function () {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(renderRooms, 150);
      });

      load();
    }());
  </script>
</body>
</html>
