const data=JSON.parse(document.getElementById('data').textContent),$=id=>document.getElementById(id);let course='',kind='전체',query='',shown=[];const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const short=s=>s.replace(/\s*\[(?!\d+기)[^\]]+\]\s*$/,'').replace(/\s*\(레오96\)$/,'');
$('updated').textContent=data.updated+' 기준';$('stats').innerHTML=[['10','강의'],[data.links.filter(l=>l.kind==='Zoom').length,'Zoom'],[data.links.filter(l=>l.kind==='리틀리').length,'리틀리']].map(([n,t])=>`<div class="stat"><strong>${n}</strong><span>${t}</span></div>`).join('');
const count=c=>data.links.filter(l=>!c||l.sources.some(s=>s.course===c)).length;

$('mobile').innerHTML=['',...data.courses].map(c=>`<option value="${esc(c)}">${c?esc(c):'전체 강의'} (${count(c)})</option>`).join('');
function setCourse(c){course=c;$('mobile').value=c;document.querySelectorAll('[data-course]').forEach(b=>b.classList.toggle('active',b.dataset.course===c));render()}
$('courses').addEventListener('click',e=>{const b=e.target.closest('[data-course]');if(b)setCourse(b.dataset.course)});$('mobile').onchange=e=>setCourse(e.target.value);document.querySelectorAll('[data-kind]').forEach(b=>b.onclick=()=>{kind=b.dataset.kind;document.querySelectorAll('[data-kind]').forEach(x=>x.classList.toggle('active',x===b));render()});$('search').oninput=e=>{query=e.target.value.trim().toLowerCase();render()};
function render(){shown=data.links.filter(l=>(!course||l.sources.some(s=>s.course===course))&&(kind==='전체'||l.kind===kind)&&(!query||(l.url+' '+l.sources.map(s=>s.room).join(' ')).toLowerCase().includes(query)));$('result').textContent=`${course?short(course):'전체 링크'} · ${shown.length}`;$('copyall').disabled=!shown.length;$('list').innerHTML=shown.length?shown.map((l,i)=>{const cs=[...new Set(l.sources.map(s=>s.course))];return `<article class="card"><div class="cardtop"><span class="badge ${l.kind==='리틀리'?'litt':''}">${l.label}</span><span class="number">${String(i+1).padStart(2,'0')}</span></div><a class="url" href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">${esc(l.url)}</a><div class="origins">${cs.map(c=>`<span class="origin">${esc(short(c))}</span>`).join('')}</div><div class="cardbottom"><details class="details"><summary>출처 ${l.sources.length}개 방 · 최근 ${l.latest.slice(0,10)}</summary>${l.sources.map(s=>`<div class="source"><strong>${esc(s.room)}</strong><time>${s.first===s.last?s.first:s.first+' ~ '+s.last}</time>${s.dates.length>2?`<details class="all-dates"><summary>게시 시각 ${s.dates.length}개 보기</summary>${s.dates.map(d=>`<div>${d}</div>`).join('')}</details>`:''}</div>`).join('')}</details><div class="actions"><button class="action" data-copy="${i}">링크 복사</button><a class="action open" href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">링크 열기 ↗</a></div></div></article>`}).join(''):'<div class="empty">해당하는 링크가 없어요.<br>강의나 검색어를 바꿔 보세요.</div>'}
async function copy(s){try{await navigator.clipboard.writeText(s)}catch{const t=document.createElement('textarea');t.value=s;document.body.append(t);t.select();document.execCommand('copy');t.remove()}$('toast').textContent='복사했어요';setTimeout(()=>$('toast').textContent='',1800)}$('list').onclick=e=>{const b=e.target.closest('[data-copy]');if(b)copy(shown[+b.dataset.copy].url)};$('copyall').onclick=()=>copy(shown.map(l=>l.url+'\n'+[...new Set(l.sources.map(s=>s.room))].join(' / ')).join('\n\n'));
$('coverage').innerHTML=data.coverage.map(c=>`<tr><td>${esc(c.room)}</td><td>${c.first?c.first.slice(0,10)+' ~ '+c.last.slice(0,10):'보관된 대화 없음'}</td><td>${c.links}</td></tr>`).join('');render();
