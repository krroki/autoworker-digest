진 및 도표 대폭 추가\n✔ 1계정 · 1채널 · 1기기 환경을 구성하는 ‘1-1-1 세팅법’ 공개\n✔ 현재 테스트 중인 ‘월 4달러 무제한 트래픽 활용법’ 일부 내용 추가\n\n━━━━━━━━━━━━━━━━━━\n\n🔍 101페이지 + 노션링크에 꽉 채운\n어디서도 보기 힘든 실전 정보\n\n* 계정 보호 극비 기술 ‘ㅇㅌㄷㅌㅌ ㅂㄹㅇㅈ’\n    수천 개 계정을 운영하는 업계 포식자들만 사용하던 비밀 세팅법과 실제 작동 방식 공개\n* 연좌제 탈출 전략\n    “채널 하나 터지면 다 날아갈까봐 무섭다고요?”\n    구글의 추적 항목을 최대한 분리하는 현재 가장 안전한 방식 수록\n* ㅁㅂㅇ ㅋㄹㅇㄷㅍ 기능 공개\n    중고폰 여러 대 구매하지 않아도 국가별 환경 구성 가능\n    물리 기기 없이 실제 폰 환경처럼 활용하는 방법 설명\n* 유튜브 채널 관리법\n    애드센스 계정 관련 고수들과 크로스체크한 현재 기준 가장 안전한 관리 방식 소개\n* 애드센스 다계정 A to Z\n    기본 세팅부터 미국 세금 정보 입력, SMS 인증까지 전부 정리\n\n━━━━━━━━━━━━━━━━━━\n\n101페이지 + 노션링크의 압도적인 분량으로\n여러분의 시행착오를 확실하게 줄여드립니다 💪\n\n📌 전자책 확인 및 구매\nhttps://litt.ly/b.programm\n\n━━━━━━━━━━━━━━━━━━\n※ 전자책 판매는 스위칭쇼츠 / 디하클 운영진과 무관하며 금전적 거래가 전혀 없습니다.\n※ 모든 선택과 책임은 구매자 본인에게 있으니 신중한 결정 부탁드립니다.","quotedText":"","date":"2026.05.07 23:48","room":"(공지방) AI 스위칭쇼츠 1기 [쇼츠대폭발]","course":"AI 스위칭쇼츠 1기 [쇼츠대폭발]"},{"sender":"임@홍(당근근)","text":"부자프로그램님 전자책은 이건가요?? https://litt.ly/b.programm","quotedText":"","date":"2026.07.01 12:14","room":"(사담방) 노멀쇼츠 1기 [시도남]","course":"노멀쇼츠 1기 [시도남]"},{"sender":"한@윤(깜찌기딸기)","text":"https://litt.ly/b.programm","quotedText":"","date":"2026.07.15 02:17","room":"(사담방) 노멀쇼츠 1기 [시도남]","course":"노멀쇼츠 1기 [시도남]"},{"sender":"시도남","text":"양봉여리님\nhttps://litt.ly/yangbong\n\n부자프로그램님 \nhttps://litt.ly/b.programm","quotedText":"","date":"2026.07.18 19:06","room":"(사담방) 노멀쇼츠 1기 [시도남]","course":"노멀쇼츠 1기 [시도남]"},{"sender":"시도남매니저","text":"양봉여리님\nhttps://litt.ly/yangbong\n\n부자프로그램님 \nhttps://litt.ly/b.programm","quotedText":"","date":"2026.07.18 19:06","room":"(사담방) 노멀쇼츠 1기 [시도남]","course":"노멀쇼츠 1기 [시도남]"},{"sender":"정@우(까까우유)","text":"양봉여리님\nhttps://litt.ly/yangbong\n\n부자프로그램님 \nhttps://litt.ly/b.programm","quotedText":"","date":"2026.07.18 19:06","room":"(사담방) 노멀쇼츠 1기 [시도남]","course":"노멀쇼츠 1기 [시도남]"},{"sender":"윤@영(윤기자)","text":"- 밍구링링님 : 수창채널 생성 노하우\nhttps://litt.ly/selfmade_yt\n\n- 부자프로그램님 : 연좌제 대비 분리 노하우\nhttps://litt.ly/b.programm\n\n- 너무재밌어님 : 영상분석,대본분석\nhttps://masisseo.shop\n\n-  수 있는 양봉여리님만의 또 다른 시크릿 전략을 소개합니다.\n\n🎁 특별 혜택 및 추가 안내\n\n* 사용 중인 핵심 프로그램 무료 제공\n양봉여리님이 실제 작업에 사용하는 프로그램을 서비스 차원에서 무료로 제공해 드립니다. *(단, 조건 없는 무료 서비스이므로 프로그램에 대한 A/S 및 관련 문의는 절대 받지 않으니 이 점 반드시 유의해 주시기 바랍니다.)\n\n* 1:1 유료 상담 창구 오픈\n전자책 내용 외에 자신의 상황에 맞는 핏한 세팅과 딥한 컨설팅이 필요하신 분들을 위해 1:1 유료 상담을 전격 오픈했습니다.\n\n⚠️ 구매 전 필수 확인 사항\n본 전자책 판매는 '디하클'및 룰루랄라릴리'와는 무관하게 진행되는 양봉여리님의 독자적인 판매 상품임을 안내해 드립니다.\n\n지금 바로, 공장처럼 흔들림 없이 찍어내는 양봉여리님의 4분 완성 시스템을 직접 확인해 보세요!\n\nhttps://litt.ly/yangbong","quotedText":"","date":"2026.06.28 23:01","room":"(사담방) 노멀쇼츠 1기 [시도남]","course":"노멀쇼츠 1기 [시도남]"}]}</script><script>const data=JSON.parse(document.getElementById('data').textContent);
const $=id=>document.getElementById(id);
let course='',kind='전체',query='',day='all',order='newest',shown=[];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const short=s=>s.replace(/\s*\[(?!\d+기)[^\]]+\]\s*$/,'').replace(/\s*\(레오96\)$/,'');
const courseThumb=c=>Object.entries(data.thumbnails).find(([room,t])=>t.course===c&&t.kind==='사담방')?.[1]?.image;
const image=(src,alt,cls='')=>src?`<img class="${cls}" src="${esc(src)}" alt="${esc(alt)}" loading="lazy" decoding="async">`:'';
const kstDay=offset=>new Date(Date.now()-offset*86400000).toLocaleDateString('sv-SE',{timeZone:'Asia/Seoul'}).replaceAll('-','.');
const selectedDay=()=>day==='all'?'':kstDay(Number(day));
const matchesBase=l=>(kind==='전체'||l.kind===kind)&&(!query||(l.title+' '+l.url+' '+l.sources.map(s=>s.room).join(' ')).toLowerCase().includes(query));
function selectSources(link,targetDay){return link.sources.filter(s=>!course||s.course===course).map(s=>({...s,dates:s.dates.filter(d=>!targetDay||d.slice(0,10)===targetDay)})).filter(s=>s.dates.length).map(s=>({...s,first:s.dates[0],last:s.dates.at(-1)}))}
function filtered(targetDay){return data.links.filter(matchesBase).map(l=>({...l,visibleSources:selectSources(l,targetDay)})).filter(l=>l.visibleSources.length)}
function shareMessages(l){return l.messageIndices.map(n=>data.messages[n]).filter(m=>l.visibleSources.some(s=>s.room===m.room&&s.dates.includes(m.date))).sort((a,b)=>(order==='oldest'?1:-1)*a.date.localeCompare(b.date))}
function bubble(m){return `<div class="chat-room-label">${esc(m.room)}</div><div class="chat-message"><span class="sender-avatar" aria-hidden="true">${esc(m.sender.slice(0,1))}</span><div class="chat-content"><div class="sender-name">${esc(m.sender)}</div><div class="bubble">${m.quotedText?`<div class="reply-label">답장에 포함된 내용</div><blockquote class="quoted-body">${esc(m.quotedText)}</blockquote>`:''}<div class="original-body">${esc(m.text)}</div></div><time class="message-time">${esc(m.date)}</time></div></div>`}
function originalSlots(l,i){const ms=shareMessages(l),names=[...new Set(ms.map(m=>m.sender))];return `<div class="shared-by"><span>공유한 사람</span> ${names.slice(0,3).map(esc).join(' · ')}${names.length>3?` 외 ${names.length-3}명`:''}</div><details class="chat-slot" data-original="${i}" ${i===0?'open':''}><summary>공유 원문 <span>${ms.length}건</span></summary><div class="chat-pane">${i===0?messageList(ms):''}</div></details>`}
function messageList(ms){return ms.map((m,j)=>j===0?bubble(m):`<details class="older-message"><summary><span>${esc(m.sender)}</span><time>${esc(m.date)}</time></summary>${bubble(m)}</details>`).join('')}
function updateDays(){const labels=[['all','전체 기간'],['0','오늘'],['1','1일 전'],['2','2일 전']];$('days').innerHTML=labels.map(([d,label])=>{const date=d==='all'?'':kstDay(Number(d));return `<button class="day${day===d?' active':''}" data-day="${d}" aria-pressed="${day===d}">${label}<span class="day-count">${filtered(date).length}</span>${date?`<small>${date.slice(5)}</small>`:'<small>모든 날짜</small>'}</button>`}).join('')}
$('updated').textContent=data.updated+' 수집 기준';
$('stats').innerHTML=[['10','강의'],[data.links.filter(l=>l.kind==='Zoom').length,'Zoom'],[data.links.filter(l=>l.kind==='리틀리').length,'리틀리']].map(([n,t])=>`<div class="stat"><strong>${n}</strong><span>${t}</span></div>`).join('');
const count=c=>data.links.filter(l=>!c||l.sources.some(s=>s.course===c)).length;
$('courses').innerHTML=['',...data.courses].map(c=>`<button class="course${c?'':' active'}" data-course="${esc(c)}">${c?image(courseThumb(c),c+' 사담방 썸네일'):'<span class="all-icon" aria-hidden="true">▦</span>'}<span class="course-name">${c?esc(short(c)):'전체 강의'}${c&&c!==short(c)?`<small>${esc(c.slice(short(c).length).trim())}</small>`:''}</span><span class="count">${count(c)}</span></button>`).join('');
$('mobile').innerHTML=['',...data.courses].map(c=>`<option value="${esc(c)}">${c?esc(c):'전체 강의'} (${count(c)})</option>`).join('');
function setCourse(c){course=c;$('mobile').value=c;document.querySelectorAll('[data-course]').forEach(b=>b.classList.toggle('active',b.dataset.course===c));$('selected-course').innerHTML=c?image(courseThumb(c),c+' 사담방 썸네일')+`<span>${esc(c)}</span>`:'';render()}
$('courses').addEventListener('click',e=>{const b=e.target.closest('[data-course]');if(b)setCourse(b.dataset.course)});
$('mobile').onchange=e=>setCourse(e.target.value);
document.querySelectorAll('[data-kind]').forEach(b=>b.onclick=()=>{kind=b.dataset.kind;document.querySelectorAll('[data-kind]').forEach(x=>x.classList.toggle('active',x===b));render()});
$('search').oninput=e=>{query=e.target.value.trim().toLowerCase();render()};
$('sort').onchange=e=>{order=e.target.value;render()};
$('days').onclick=e=>{const b=e.target.closest('[data-day]');if(b){day=b.dataset.day;render()}};
function render(){
  updateDays();
  shown=filtered(selectedDay()).map(l=>{const times=l.visibleSources.flatMap(s=>s.dates).sort();return {...l,displayTime:order==='oldest'?times[0]:times.at(-1)}}).sort((a,b)=>(order==='oldest'?1:-1)*a.displayTime.localeCompare(b.displayTime)||a.url.localeCompare(b.url));
  $('result').textContent=`${course?short(course):'전체 링크'} · ${shown.length}`;
  $('copyall').disabled=!shown.length;
  let lastDate='';
  $('list').innerHTML=shown.length?shown.map((l,i)=>{
    const cs=[...new Set(l.visibleSources.map(s=>s.course))];
    const date=l.displayTime.slice(0,10);const heading=date!==lastDate?`<h3 class="day-heading">${date}</h3>`:'';lastDate=date;
    return `${heading}<article class="card" data-time="${esc(l.displayTime)}"><div class="cardtop"><span class="badge ${l.kind==='리틀리'?'litt':''}">${l.label}</span><time class="posted">${order==='oldest'?'첫 게시':'최근 게시'} ${l.displayTime}</time><span class="number">${String(i+1).padStart(2,'0')}</span></div><h3 class="link-title">${esc(l.title)}</h3><a class="url" href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">${esc(l.url)}</a><div class="origins">${cs.map(c=>`<span class="origin">${image(courseThumb(c),c+' 사담방 썸네일')}<span>${esc(short(c))}</span></span>`).join('')}</div><div class="cardbottom"><details class="details"><summary>출처 ${l.visibleSources.length}개 방</summary>${l.visibleSources.map(s=>`<div class="source">${image(data.thumbnails[s.room]?.image,s.room+' 썸네일')}<div class="source-info"><strong>${esc(s.room)}</strong><time>${s.first===s.last?s.first:s.first+' ~ '+s.last}</time>${s.dates.length>2?`<details class="all-dates"><summary>게시 시각 ${s.dates.length}개 보기</summary>${s.dates.map(d=>`<div>${d}</div>`).join('')}</details>`:''}</div></div>`).join('')}</details><div class="actions"><button class="action" data-copy="${i}">링크 복사</button><a class="action open" href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">링크 열기 ↗</a></div></div></article>`;
  }).join(''):`<div class="empty">${day!=='all'?'이 날짜에 게시된 링크가 없어요.':course&&!query?'이 강의의 보관된 대화에서 링크를 찾지 못했어요.':'해당하는 링크가 없어요.'}<br>날짜·강의·검색어를 바꿔 보세요.</div>`;
  document.querySelectorAll('article.card').forEach((card,i)=>{card.querySelector('.cardbottom').insertAdjacentHTML('beforebegin',originalSlots(shown[i],i));const slot=card.querySelector('.chat-slot');slot.addEventListener('toggle',()=>{if(slot.open&&!slot.querySelector('.chat-pane').innerHTML)slot.querySelector('.chat-pane').innerHTML=messageList(shareMessages(shown[i]))})});
}
async function copy(s){try{await navigator.clipboard.writeText(s)}catch{const t=document.createElement('textarea');t.value=s;document.body.append(t);t.select();document.execCommand('copy');t.remove()}$('toast').textContent='복사했어요';setTimeout(()=>$('toast').textContent='',1800)}
$('list').onclick=e=>{const b=e.target.closest('[data-copy]');if(b)copy(shown[+b.dataset.copy].url)};
$('copyall').onclick=()=>copy(shown.map(l=>l.title+'\n'+l.displayTime+'\n'+l.url+'\n'+[...new Set(l.visibleSources.map(s=>s.room))].join(' / ')).join('\n\n'));
$('coverage').innerHTML=data.coverage.map(c=>`<tr><td><span class="coverage-room">${image(data.thumbnails[c.room]?.image,c.room+' 썸네일')}<span>${esc(c.room)}</span></span></td><td>${c.first?c.first.slice(0,10)+' ~ '+c.last.slice(0,10):'보관된 대화 없음'}</td><td>${c.links}</td></tr>`).join('');
render();
</script></body></html>
