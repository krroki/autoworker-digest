function badge(row,key){const m=row.membership[key],optional=key==='premium'&&row.track!=='premium';return `<span class="mobile-label">${labels[key]}</span><span class="badge ${m.status==='present'?'':optional?'neutral':'no'}">${m.status==='present'?'확인':m.status==='ambiguous'?'중복':optional?'대상 아님':'미확인'}</span>`}
function detail(r){return `<details class="details-row"><summary>상세 보기</summary>${Object.entries(r.membership).filter(([,m])=>m.nicknames.length).map(([k,m])=>`<p>${labels[k]} · ${m.nicknames.map(esc).join(', ')}${k==='cafe'&&m.grades.length?' / '+m.grades.map(esc).join(', '):''}</p>`).join('')}${r.issues.map(i=>`<p>${esc(i)}</p>`).join('')}<p>${r.sheetRows.map(n=>`<a target="_blank" rel="noreferrer" href="${esc(sheetRow(n))}">${n}행 ↗</a>`).join('')}</p></details>`}

function choose(value,reset=false){filter=value;extra=false;page=0;if(reset){$('search').value='';$('track').value='student'}render()}
$('search').addEventListener('input',()=>{page=0;render()});$('track').addEventListener('change',()=>{page=0;render()});$('status-filter').addEventListener('change',e=>choose(e.target.value));document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>choose(b.dataset.filter)));document.querySelectorAll('[data-source]').forEach(b=>b.addEventListener('click',()=>{choose(b.dataset.source,true);$('workspace').scrollIntoView({block:'start'})}));$('review-jump').addEventListener('click',()=>{choose('review',true);$('workspace').scrollIntoView({block:'start'})});$('extra-mode').addEventListener('click',()=>{extra=!extra;page=0;render()});$('reset').addEventListener('click',()=>choose('all',true));$('prev').addEventListener('click',()=>{page--;render();$('workspace').scrollIntoView({block:'start'})});$('next').addEventListener('click',()=>{page++;render();$('workspace').scrollIntoView({block:'start'})});render();
