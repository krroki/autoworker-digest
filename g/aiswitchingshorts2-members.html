 $('cards').innerHTML=Object.entries(labels).map(([k,label])=>{const x=s.sources[k],src=d.sources[k],total=k==='cafe'?src.count:src.activeCount,n=d.participants[k].length,[color,tint,icon]=colors[k];return `<article class="card" style="--color:${color};--tint:${tint}"><div class="card-head">${label}<span class="source-icon" aria-hidden="true">${icon}</span></div><div class="source-time">${date(src.fetchedAt)} 수집</div><div class="large">${fmt(total)}<span>전체 인원</span></div><div class="bar"><i style="width:${Math.min(100,100*x.matched/x.target)}%"></i></div><div class="card-bottom"><span>${k==='premium'?'프리미엄':'수강생'} 확인 <strong>${fmt(x.matched)}</strong> / ${fmt(x.target)}</span><button data-source="${k}">미확인 ${fmt(x.unconfirmed)}명 ↗</button></div><div class="card-links"><span>${k==='cafe'?`수집 명단 ${fmt(n)}명`:`명단 ${fmt(n)}명 · 표시와 ${fmt(total-n)}명 차이`}</span><button data-room="${k}" aria-label="${label} 참여자 목록 보기">명단 보기 →</button></div>${k==='cafe'?'':`<div class="profile-summary"><span>프로필 오픈채팅${x.profileChat.unknown?` <small>미확인 ${fmt(x.profileChat.unknown)}명</small>`:''}</span><button data-profile-room="${k}" aria-label="${label} 오픈채팅 열림 ${x.profileChat.open}명 보기">열림 <b>${fmt(x.profileChat.open)}명</b> →</button></div>`}</article>`}).join('');
 $('method').innerHTML=`<p>시트 G열 닉네임·B열 등급으로 대조해요. 카페·사담방·공지방은 수강생 ${fmt(s.students)}명, 프리미엄방은 ${fmt(s.premium)}명이 대상이에요. 운영진 ${fmt(s.staff)}명과 환불 ${fmt(s.refundRows)}행은 수강생 수에서 제외해요.</p><p>참여자 목록은 수집 시점에 방에 참여한 닉네임이에요. 실시간 접속 여부를 뜻하지 않아요. 표시 인원과 수집 명단의 차이는 확인이 필요해요.</p><p>미확인은 동일한 닉네임을 찾지 못한 상태예요. 다른 닉네임으로 참여했을 수 있어요. 시트 밖도 무단 참여를 뜻하지 않아요.</p><p>프로필 오픈채팅 열림은 기존 운영 기준(ADR-0045)에 따라 프로필에 연결된 오픈채팅이 있는 상태예요. 오픈프로필 종류나 현재 온라인 여부와는 달라요. 수집 명단 기준 방별 인원으로, 같은 사람이 여러 방에 있으면 각각 포함돼요. 값이 없으면 미확인으로 남겨요.</p><p>새로고침은 최신 게시본을 불러와요. 원본 시트·카페·톡방을 다시 수집하는 기능은 아니에요. 각 공간의 수집 시각을 확인해 주세요.</p>`;
}
function badge(r,k){const m=r.membership[k],optional=k==='premium'&&r.track!=='premium';return `<span class="mobile-label">${labels[k]}</span><span class="badge ${m.status==='present'?'':optional?'neutral':'no'}">${m.status==='present'?'가입 확인':m.status==='ambiguous'?'중복':optional?'대상 아님':'미확인'}</span>`}
function detail(r){return `<details class="details-row"><summary>상세 보기</summary>${Object.entries(r.membership).filter(([,m])=>m.nicknames.length).map(([k,m])=>`<p>${labels[k]} · ${m.nicknames.map(esc).join(', ')}${k==='cafe'&&m.grades.length?' / '+m.grades.map(esc).join(', '):''}</p>`).join('')}${r.issues.map(i=>`<p>${esc(i)}</p>`).join('')}<p>${r.sheetRows.map(n=>`<a target="_blank" rel="noreferrer" href="${esc(sheetRow(n))}">${n}행 ↗</a>`).join('')}</p></details>`}
function sync(){document.querySelectorAll('[data-filter]').forEach(b=>b.setAttribute('aria-pressed',String(mode==='comparison'&&(b.dataset.filter==='all'?filter==='all':filter!=='all'))));$('participants-mode').setAttribute('aria-pressed',String(mode==='participants'));$('extra-mode').setAttribute('aria-pressed',String(mode==='extra'));$('status-filter').value=filter;$('room').hidden=mode!=='participants';$('profile-filter').hidden=mode!=='participants'||$('room').value==='cafe';$('track').hidden=mode!=='comparison';$('status-filter').hidden=mode!=='comparison';$('directory').hidden=mode!=='participants';$('table-wrap').hidden=mode==='participants';}
function render(){const q=$('search').value.trim().toLocaleLowerCase(),track=$('track').value,room=$('room').value;let rows=mode==='participants'?d.participants[room]:mode==='extra'?d.extras:d.rows;rows=rows.filter(r=>{if(mode==='participants'&&room!=='cafe'&&$('profile-filter').value!=='all'&&r.profileChat!==$('profile-filter').value)return false;if(q&&!(mode==='comparison'?[r.nickname,...Object.values(r.membership).flatMap(m=>m.nicknames)]:[r.nickname]).some(n=>n.toLocaleLowerCase().includes(q)))return false;if(mode!=='comparison')return true;if(track==='student'&&!['normal','premium'].includes(r.track))return false;if(!['all','student'].includes(track)&&r.track!==track)return false;if(filter==='review')return r.issues.length>0;if(filter==='duplicate')return r.duplicate;if(labels[filter])return r.membership[filter].status==='unconfirmed'&&(filter!=='premium'||r.track==='premium');return true});if(mode==='participants')rows=[...rows].sort((a,b)=>a.nickname.localeCompare(b.nickname,'ko'));const pages=Math.max(1,Math.ceil(rows.length/pageSize));page=Math.max(0,Math.min(page,pages-1));const shown=rows.slice(page*pageSize,(page+1)*pageSize);
 $('count').innerHTML=`${mode==='participants'?labels[room]+(room!=='cafe'&&$('profile-filter').value!=='all'?' · '+({open:'오픈채팅 열림',closed:'오픈채팅 닫힘',unknown:'상태 미확인'}[$('profile-filter').value]):''):mode==='extra'?'시트 밖':'명단'} <b>${fmt(rows.length)}${mode==='extra'?'건':'명'}</b>`;
 $('hint').textContent=mode==='participants'?`${date(d.sources[room].fetchedAt)} 수집 명단`:mode==='extra'?'기준 시트에서 찾지 못한 닉네임이에요.':'미확인은 닉네임 대조 기준이에요.';
 $('directory').innerHTML=mode==='participants'?shown.map(r=>`<div class="member"><span class="avatar" aria-hidden="true">${esc(Array.from(r.nickname)[0]||'·')}</span><div class="member-name">${esc(r.nickname)}${r.profileChat==='open'?'<span class="profile-tag">오픈채팅 열림</span>':r.profileChat==='unknown'?'<span class="profile-tag unknown">상태 미확인</span>':''}${r.grade?`<div class="member-grade">${esc(r.grade)}</div>`:''}</div></div>`).join(''):'';
 $('thead').innerHTML=mode==='extra'?'<tr><th>닉네임</th><th>참여 공간</th><th>카페 등급</th></tr>':'<tr><th>닉네임</th>'+Object.values(labels).map(label=>`<th>${label}</th>`).join('')+'<th>확인 항목</th></tr>';
 $('rows').innerHTML=mode==='participants'?'':shown.map(r=>{if(mode==='extra')return `<tr><td><strong>${esc(r.nickname)}</strong></td><td><span class="mobile-label">참여 공간</span>${labels[r.source]}</td><td><span class="mobile-label">카페 등급</span>${esc(r.grade||'—')}</td></tr>`;const issues=r.issues.map(i=>i.replace(' 명단 미확인',' 미확인').replace('시트·카페 등급 대조','카페 등급 차이').replace('일반반·프리미엄방 참여 대조','일반반의 프리미엄방 참여').replace('시트 중복·환불 이력 확인','시트 중복·환불 이력'));return `<tr><td><div class="person"><div><a target="_blank" rel="noreferrer" href="${esc(sheetRow(r.sheetRows[0]))}"><strong>${esc(r.nickname)}</strong></a><div class="track">${tracks[r.track]}</div></div>${detail(r)}</div></td>${Object.keys(labels).map(k=>`<td>${badge(r,k)}</td>`).join('')}<td><span class="issue">${issues.length?issues.map(esc).join(' · '):'—'}</span></td></tr>`}).join('');
 $('empty').hidden=rows.length>0;$('page').textContent=`${page+1} / ${pages}`;$('prev').disabled=page===0;$('next').disabled=page>=pages-1;sync();}
function choose(value,reset=false){filter=value;mode='comparison';page=0;if(reset){$('search').value='';$('track').value='student'}render()}
function roomView(room,profile='all'){mode='participants';$('profile-filter').value=profile;if(room)$('room').value=room;$('search').value='';page=0;render()}
const jump=()=>$('workspace').scrollIntoView({block:'start'});
$('search').addEventListener('input',()=>{page=0;render()});$('track').addEventListener('change',()=>{page=0;render()});$('room').addEventListener('change',()=>{page=0;render()});$('profile-filter').addEventListener('change',()=>{page=0;render()});$('status-filter').addEventListener('change',e=>choose(e.target.value));document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>choose(b.dataset.filter)));$('cards').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.profileRoom)roomView(b.dataset.profileRoom,'open');else if(b.dataset.source)choose(b.dataset.source,true);else if(b.dataset.room)roomView(b.dataset.room);jump()});$('review-jump').addEventListener('click',()=>{choose('review',true);jump()});$('participants-mode').addEventListener('click',()=>roomView());$('extra-mode').addEventListener('click',()=>{mode='extra';page=0;$('search').value='';render()});$('reset').addEventListener('click',()=>{$('search').value='';$('profile-filter').value='all';page=0;render()});$('prev').addEventListener('click',()=>{page--;render();jump()});$('next').addEventListener('click',()=>{page++;render();jump()});
$('refresh').addEventListener('click',async()=>{const b=$('refresh');b.disabled=true;b.setAttribute('aria-busy','true');$('refresh-status').textContent='게시본 불러오는 중…';const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),15000);try{const u=new URL(location.href);u.searchParams.set('refresh',Date.now());const response=await fetch(u,{cache:'no-store',signal:controller.signal});if(!response.ok)throw Error();const doc=new DOMParser().parseFromString(await response.text(),'text/html'),next=JSON.parse(doc.getElementById('data').textContent);if(!next.summary||!next.participants||!next.sources.notice||!next.summary.sources.notice.profileChat||!Array.isArray(next.rows))throw Error();const changed=d.generatedAt!==next.generatedAt;d=next;s=d.summary;overview();render();$('refresh-status').textContent=changed?'최신 게시본을 불러왔어요.':'최신 게시본이에요.'}catch{$('refresh-status').textContent='불러오지 못했어요. 다시 눌러 주세요.'}finally{clearTimeout(timer);b.disabled=false;b.removeAttribute('aria-busy')}});
overview();render();
</script></body></html>
