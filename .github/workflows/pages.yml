# 2026-11-23: legacy 브랜치 빌드가 «배포 성공» 인데 바로 앞 커밋 트리를 올린 일 2건(b342dbb · b43dea3) — 커밋 그대로를 올리는 Actions 배포로 바꿈.
# 23:30 205afbd: 한 job 안에서 upload 직후(0.7초) deploy-pages 가 아티팩트 0개를 봐 실패 → GitHub 표준 꼴(build job → deploy job needs) 로 나눔.
# 기록 = D:/dev/12.kakao/.task/pages-stale-tree-1123 · 확인기 = 12.kakao scripts/pages_live_check.py
name: pages
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
